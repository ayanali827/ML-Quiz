<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ML Quiz | AIC3503 / AICL3503</title>
<style>
  /* ---------- Base layout (mobile first) ---------- */
  :root { --blue:#0b4fa3; --blue-d:#083a78; --ink:#1d2433; --muted:#5b6577; --line:#d9dee7; --bg:#f4f6fa; --ok:#1d7a46; --bad:#b3261e; --warn:#a35c00; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size:16px; line-height:1.45; }
  body.locked { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  header { background:var(--blue); color:#fff; padding:14px 18px; }
  header h1 { margin:0; font-size:1.05rem; font-weight:600; }
  header p { margin:2px 0 0; font-size:.85rem; opacity:.85; }
  main { max-width:720px; margin:0 auto; padding:18px 14px 90px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:14px; }
  h2 { font-size:1.15rem; margin:0 0 12px; }
  label { display:block; font-weight:600; font-size:.9rem; margin:12px 0 4px; }
  input[type=text] { width:100%; padding:11px 12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; }
  input[type=text]:focus { outline:2px solid var(--blue); border-color:var(--blue); }
  .btn { display:inline-block; border:0; border-radius:8px; padding:12px 20px; font-size:1rem; font-weight:600;
    background:var(--blue); color:#fff; cursor:pointer; }
  .btn:hover { background:var(--blue-d); }
  .btn[disabled] { background:#9aa6b8; cursor:not-allowed; }
  .btn.ghost { background:#fff; color:var(--blue); border:1px solid var(--blue); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  .err { color:var(--bad); font-size:.9rem; margin-top:10px; min-height:1.2em; }
  ul.rules { padding-left:20px; margin:8px 0 0; }
  ul.rules li { margin:6px 0; }
  .hidden { display:none !important; }

  /* ---------- Quiz screen ---------- */
  .topbar { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line);
    padding:10px 14px; display:flex; justify-content:space-between; align-items:center; font-size:.9rem; }
  .timer { font-variant-numeric:tabular-nums; font-weight:700; }
  .timer.low { color:var(--bad); }
  .progress { height:5px; background:var(--line); }
  .progress > div { height:100%; background:var(--blue); width:0; transition:width .2s; }
  .qmeta { font-size:.8rem; color:var(--muted); margin-bottom:6px; }
  .qtype { display:inline-block; font-size:.75rem; font-weight:700; padding:2px 8px; border-radius:20px;
    background:#e8effa; color:var(--blue); margin-bottom:8px; }
  .qtext { font-size:1.05rem; font-weight:600; margin:0 0 14px; }
  .ctx { background:#f6f8fb; border-left:3px solid var(--blue); padding:8px 10px; font-size:.9rem; margin-bottom:12px; }
  .opt { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:8px;
    padding:12px; margin:8px 0; cursor:pointer; background:#fff; }
  .opt:hover { border-color:var(--blue); }
  .opt.sel { border-color:var(--blue); background:#eef4fd; }
  .opt input { margin-top:3px; transform:scale(1.2); }
  .opt b { min-width:1.2em; }
  .watermark { position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.06; font-size:22px; font-weight:700;
    display:flex; flex-wrap:wrap; align-content:space-around; justify-content:space-around; transform:rotate(-20deg); overflow:hidden; }
  .watermark span { margin:0 28px; white-space:nowrap; }
  .bottombar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
    padding:10px 14px; display:flex; justify-content:space-between; align-items:center; z-index:6; }
  .warnbox { position:fixed; inset:0; background:rgba(20,24,33,.75); z-index:20; display:flex; align-items:center; justify-content:center; padding:20px; }
  .warnbox .card { max-width:420px; }
  .warnbox h2 { color:var(--bad); }
  .big { font-size:2.2rem; font-weight:800; color:var(--blue); margin:6px 0; }
  .small { font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="hdrTitle">Machine Learning Quiz</h1>
  <p>AIC3503 Machine Learning / AICL3503 Lab · SZABIST</p>
</header>

<!-- ============ 1. REGISTRATION ============ -->
<main id="scrRegister">
  <div class="card">
    <h2>Register to start</h2>
    <label for="inName">Full name</label>
    <input type="text" id="inName" autocomplete="name" maxlength="60" placeholder="e.g. Ali Raza">
    <label for="inRoll">Roll No.</label>
    <input type="text" id="inRoll" autocomplete="off" maxlength="20" placeholder="e.g. 2312345">
    <label for="inSection">Section</label>
    <input type="text" id="inSection" autocomplete="off" maxlength="20" placeholder="e.g. BSAI A">
    <div class="err" id="regErr"></div>
    <div class="row" style="margin-top:12px"><span></span><button class="btn" id="btnNext">Next</button></div>
  </div>
</main>

<!-- ============ 2. RULES ============ -->
<main id="scrRules" class="hidden">
  <div class="card">
    <h2>Before you begin</h2>
    <p id="rulesWho" class="small"></p>
    <ul class="rules" id="rulesList"></ul>
    <div class="err" id="startErr"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="btnBack">Back</button>
      <button class="btn" id="btnStart">Start quiz</button>
    </div>
  </div>
</main>

<!-- ============ 3. QUIZ ============ -->
<div id="scrQuiz" class="hidden">
  <div class="topbar">
    <span id="qCounter">Question 1 of 35</span>
    <span>Time left: <span class="timer" id="timer">--:--</span></span>
  </div>
  <div class="progress"><div id="progBar"></div></div>
  <div class="watermark" id="watermark"></div>
  <main style="position:relative;z-index:2">
    <div class="card" id="qCard"></div>
  </main>
  <div class="bottombar">
    <span class="small" id="viol">Tab switches: 0</span>
    <button class="btn" id="btnQNext">Next</button>
  </div>
</div>

<!-- ============ 4. DONE ============ -->
<main id="scrDone" class="hidden">
  <div class="card" style="text-align:center">
    <h2 id="doneTitle">Submitting…</h2>
    <div id="doneBody" class="small">Please keep this page open.</div>
    <div style="margin-top:14px"><button class="btn hidden" id="btnRetry">Retry submission</button></div>
  </div>
</main>

<!-- ============ Overlay used for warnings and confirmations ============ -->
<div class="warnbox hidden" id="overlay">
  <div class="card">
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <div class="row">
      <button class="btn ghost hidden" id="ovCancel">Cancel</button>
      <button class="btn" id="ovOk">OK</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURATION: edit these values
   ===================================================================== */
const CONFIG = {
  // Paste your Google Apps Script Web App URL here (see SETUP_GUIDE.md, step 2).
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxqW7DqXaU1wY_KZFOn2SkxxHdT580Zz_skkY5zLqUDpPmQhMG-pb9izZ3aDIEnvs0Dig/exec",
  QUIZ_ID: "ML-QUIZ-2",          // change for a new quiz so old attempts don't block it
  QUIZ_TITLE: "Machine Learning Quiz",

  MAX_VIOLATIONS: 2,             // tab switches allowed; the next one auto-submits
  SHOW_SCORE: true               // show the score to the student after submitting
};

/* Question bank (no answers here; grading happens on the server) */
const QUESTIONS = [{"id":1,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What is a decision tree mainly used for?","options":[{"k":"A","t":"Clustering unlabelled data only"},{"k":"B","t":"Classification and regression"},{"k":"C","t":"Storing data in a database"},{"k":"D","t":"Compressing images"}]},{"id":2,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What is the topmost node of a decision tree called?","options":[{"k":"A","t":"Leaf node"},{"k":"B","t":"Root node"},{"k":"C","t":"Branch"},{"k":"D","t":"Child node"}]},{"id":3,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which nodes give the final prediction in a decision tree?","options":[{"k":"A","t":"Root nodes"},{"k":"B","t":"Internal nodes"},{"k":"C","t":"Leaf nodes"},{"k":"D","t":"Split nodes"}]},{"id":4,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What does entropy measure in a decision tree?","options":[{"k":"A","t":"Model accuracy"},{"k":"B","t":"Impurity or uncertainty in the data"},{"k":"C","t":"Distance between two points"},{"k":"D","t":"Depth of the tree"}]},{"id":5,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which of the following are parts of a decision tree?","options":[{"k":"A","t":"Root node"},{"k":"B","t":"Branches"},{"k":"C","t":"Leaf nodes"},{"k":"D","t":"Centroids"},{"k":"E","t":"Kernels"}]},{"id":6,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What is the entropy of a node where all samples belong to the same class?","options":[{"k":"A","t":"0"},{"k":"B","t":"0.5"},{"k":"C","t":"1"},{"k":"D","t":"Infinity"}]},{"id":7,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"For a two-class problem, entropy is at its maximum value of 1 when:","options":[{"k":"A","t":"All samples are in one class"},{"k":"B","t":"90% of samples are in one class"},{"k":"C","t":"Samples are split 50% / 50% between the classes"},{"k":"D","t":"There are no samples"}]},{"id":8,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which is the formula for entropy?","options":[{"k":"A","t":"Σ pᵢ²"},{"k":"B","t":"1 − Σ pᵢ"},{"k":"C","t":"Σ (xᵢ − μ)²"},{"k":"D","t":"−Σ pᵢ log₂ pᵢ"}]},{"id":9,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"How is information gain calculated?","options":[{"k":"A","t":"Entropy of the parent minus the weighted average entropy of the children"},{"k":"B","t":"Entropy of the children minus entropy of the parent"},{"k":"C","t":"Number of leaves divided by tree depth"},{"k":"D","t":"Accuracy minus error rate"}]},{"id":10,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which measures can be used to choose the best split in a decision tree?","options":[{"k":"A","t":"Information gain"},{"k":"B","t":"Gini index"},{"k":"C","t":"Gain ratio"},{"k":"D","t":"Euclidean distance"},{"k":"E","t":"Learning rate"}]},{"id":11,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Who developed the ID3 decision tree algorithm?","options":[{"k":"A","t":"Geoffrey Hinton"},{"k":"B","t":"Ross Quinlan"},{"k":"C","t":"Vladimir Vapnik"},{"k":"D","t":"Alan Turing"}]},{"id":12,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which splitting measure does the C4.5 algorithm use?","options":[{"k":"A","t":"Gini index"},{"k":"B","t":"Mean squared error"},{"k":"C","t":"Gain ratio"},{"k":"D","t":"Cosine similarity"}]},{"id":13,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which splitting measure does the CART algorithm use for classification?","options":[{"k":"A","t":"Gini index"},{"k":"B","t":"Gain ratio"},{"k":"C","t":"Euclidean distance"},{"k":"D","t":"Support and confidence"}]},{"id":14,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What is the Gini index of a pure node?","options":[{"k":"A","t":"1"},{"k":"B","t":"0.5"},{"k":"C","t":"0.25"},{"k":"D","t":"0"}]},{"id":15,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which are advantages of decision trees?","options":[{"k":"A","t":"Easy to understand and interpret"},{"k":"B","t":"Can handle both numerical and categorical data"},{"k":"C","t":"Need little data preparation"},{"k":"D","t":"They never overfit"},{"k":"E","t":"They always give the highest accuracy"}]},{"id":16,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What is the main disadvantage of a fully grown decision tree?","options":[{"k":"A","t":"It cannot handle categorical data"},{"k":"B","t":"It tends to overfit the training data"},{"k":"C","t":"It needs labelled clusters"},{"k":"D","t":"It cannot be visualized"}]},{"id":17,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What does pruning a decision tree mean?","options":[{"k":"A","t":"Removing branches to reduce overfitting"},{"k":"B","t":"Adding more leaves to the tree"},{"k":"C","t":"Changing the root node randomly"},{"k":"D","t":"Converting the tree into clusters"}]},{"id":18,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What is pre-pruning?","options":[{"k":"A","t":"Cutting branches after the full tree is built"},{"k":"B","t":"Deleting the training data"},{"k":"C","t":"Stopping the growth of the tree early"},{"k":"D","t":"Training two trees together"}]},{"id":19,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What is post-pruning?","options":[{"k":"A","t":"Stopping the tree at depth 1"},{"k":"B","t":"Growing the full tree first, then removing weak branches"},{"k":"C","t":"Removing the root node"},{"k":"D","t":"Pruning before any training"}]},{"id":20,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which scikit-learn parameters act as pre-pruning controls for a decision tree?","options":[{"k":"A","t":"max_depth"},{"k":"B","t":"min_samples_split"},{"k":"C","t":"min_samples_leaf"},{"k":"D","t":"n_clusters"},{"k":"E","t":"n_neighbors"}]},{"id":21,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"A decision tree classifier is an example of:","options":[{"k":"A","t":"Supervised learning"},{"k":"B","t":"Unsupervised learning"},{"k":"C","t":"Reinforcement learning"},{"k":"D","t":"No learning"}]},{"id":22,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What does each internal node of a decision tree represent?","options":[{"k":"A","t":"A final class label"},{"k":"B","t":"A cluster centre"},{"k":"C","t":"A test on an attribute"},{"k":"D","t":"A probability value"}]},{"id":23,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What does each branch of a decision tree represent?","options":[{"k":"A","t":"A dataset"},{"k":"B","t":"An outcome of the test at a node"},{"k":"C","t":"A leaf"},{"k":"D","t":"An error value"}]},{"id":24,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"A decision tree that predicts a continuous value is called a:","options":[{"k":"A","t":"Classification tree"},{"k":"B","t":"Binary tree"},{"k":"C","t":"Search tree"},{"k":"D","t":"Regression tree"}]},{"id":25,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"In a model tree, what do the leaves contain?","options":[{"k":"A","t":"Linear regression models"},{"k":"B","t":"Only class labels"},{"k":"C","t":"Cluster IDs"},{"k":"D","t":"Nothing"}]},{"id":26,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which scikit-learn class is used for decision tree classification?","options":[{"k":"A","t":"KMeans"},{"k":"B","t":"DecisionTreeClassifier"},{"k":"C","t":"LinearRegression"},{"k":"D","t":"KNeighborsClassifier"}]},{"id":27,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which are valid values for the criterion parameter of scikit-learn's DecisionTreeClassifier?","options":[{"k":"A","t":"\"gini\""},{"k":"B","t":"\"entropy\""},{"k":"C","t":"\"log_loss\""},{"k":"D","t":"\"euclidean\""},{"k":"E","t":"\"rbf\""}]},{"id":28,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"A higher information gain for an attribute means:","options":[{"k":"A","t":"A worse split"},{"k":"B","t":"More noise in the data"},{"k":"C","t":"A better split"},{"k":"D","t":"The tree must stop"}]},{"id":29,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"If the information gain of an attribute is 0, then splitting on it:","options":[{"k":"A","t":"Gives no improvement in purity"},{"k":"B","t":"Gives perfect purity"},{"k":"C","t":"Doubles the accuracy"},{"k":"D","t":"Removes all leaves"}]},{"id":30,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"How does a decision tree choose its splits?","options":[{"k":"A","t":"Randomly, all at once"},{"k":"B","t":"Greedily, top-down, one node at a time"},{"k":"C","t":"Bottom-up from the leaves"},{"k":"D","t":"By clustering the data first"}]},{"id":31,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"When entropy is computed with log base 2, what is its unit?","options":[{"k":"A","t":"Metres"},{"k":"B","t":"Percent"},{"k":"C","t":"Seconds"},{"k":"D","t":"Bits"}]},{"id":32,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"When does a decision tree stop splitting a node?","options":[{"k":"A","t":"All samples in the node belong to one class"},{"k":"B","t":"No attributes are left to split on"},{"k":"C","t":"The maximum depth is reached"},{"k":"D","t":"Accuracy is exactly 50%"},{"k":"E","t":"The dataset contains numbers"}]},{"id":33,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Information gain is biased towards attributes that:","options":[{"k":"A","t":"Have only two values"},{"k":"B","t":"Are numeric"},{"k":"C","t":"Have many distinct values"},{"k":"D","t":"Have missing values"}]},{"id":34,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"A node has 2 \"Yes\" and 2 \"No\" samples. What is its entropy?","options":[{"k":"A","t":"0"},{"k":"B","t":"1"},{"k":"C","t":"0.5"},{"k":"D","t":"2"}]},{"id":35,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"In a classification tree, what does a leaf node output?","options":[{"k":"A","t":"A class label"},{"k":"B","t":"A centroid"},{"k":"C","t":"A distance value"},{"k":"D","t":"A new dataset"}]},{"id":36,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What does the Gini index measure?","options":[{"k":"A","t":"The depth of the tree"},{"k":"B","t":"The number of features"},{"k":"C","t":"The probability of misclassifying a randomly chosen sample"},{"k":"D","t":"The distance between clusters"}]},{"id":37,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"For a two-class problem, what is the maximum value of the Gini index?","options":[{"k":"A","t":"1"},{"k":"B","t":"0.5"},{"k":"C","t":"0"},{"k":"D","t":"2"}]},{"id":38,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which types of features can a decision tree handle directly?","options":[{"k":"A","t":"Numerical features"},{"k":"B","t":"Raw audio waveforms with no feature extraction"},{"k":"C","t":"Categorical features"},{"k":"D","t":"Binary (yes/no) features"},{"k":"E","t":"None; it needs images"}]},{"id":39,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Do decision trees need feature scaling (normalization)?","options":[{"k":"A","t":"Yes, always"},{"k":"B","t":"Only for categorical data"},{"k":"C","t":"Only when the tree is deep"},{"k":"D","t":"No, splits are based on thresholds, not distances"}]},{"id":40,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What is the depth of a decision tree?","options":[{"k":"A","t":"The length of the longest path from the root to a leaf"},{"k":"B","t":"The number of features"},{"k":"C","t":"The number of samples"},{"k":"D","t":"The number of classes"}]},{"id":41,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"A decision tree with depth 1 is most likely to:","options":[{"k":"A","t":"Overfit"},{"k":"B","t":"Underfit"},{"k":"C","t":"Be perfect"},{"k":"D","t":"Never make predictions"}]},{"id":42,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"A decision tree with only one split is called a:","options":[{"k":"A","t":"Random forest"},{"k":"B","t":"Leaf tree"},{"k":"C","t":"Decision stump"},{"k":"D","t":"Model tree"}]},{"id":43,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which methods use decision trees as their base learners?","options":[{"k":"A","t":"Random Forest"},{"k":"B","t":"K-Means"},{"k":"C","t":"AdaBoost"},{"k":"D","t":"Gradient Boosting"},{"k":"E","t":"Naive Bayes"}]},{"id":44,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"How are missing values commonly handled when preparing data for a decision tree?","options":[{"k":"A","t":"By filling them in (imputation) or using surrogate splits"},{"k":"B","t":"By deleting the whole dataset"},{"k":"C","t":"By setting all missing values to infinity"},{"k":"D","t":"They are always ignored without any effect"}]},{"id":45,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"How does a decision tree split a continuous attribute such as Age?","options":[{"k":"A","t":"It cannot use continuous attributes"},{"k":"B","t":"By choosing a threshold, for example Age ≤ 30"},{"k":"C","t":"By clustering ages first"},{"k":"D","t":"By using every age as a separate branch only"}]},{"id":46,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Each path from the root to a leaf can be written as:","options":[{"k":"A","t":"A cluster"},{"k":"B","t":"A matrix"},{"k":"C","t":"An IF–THEN rule"},{"k":"D","t":"A probability distribution"}]},{"id":47,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"A node has three classes in equal proportion (1/3 each). What is its entropy?","options":[{"k":"A","t":"0"},{"k":"B","t":"0.5"},{"k":"C","t":"1.0"},{"k":"D","t":"About 1.585"}]},{"id":48,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which statements about entropy are correct?","options":[{"k":"A","t":"Entropy can be negative"},{"k":"B","t":"For two classes, entropy ranges from 0 to 1"},{"k":"C","t":"An entropy of 0 means the node is pure"},{"k":"D","t":"Entropy is the same as accuracy"},{"k":"E","t":"Higher entropy means the classes are more mixed"}]},{"id":49,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which algorithm uses information gain to build a decision tree?","options":[{"k":"A","t":"ID3"},{"k":"B","t":"K-Means"},{"k":"C","t":"Apriori"},{"k":"D","t":"KNN"}]},{"id":50,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Information gain values: Outlook = 0.25, Humidity = 0.15, Wind = 0.05. Which attribute becomes the root?","options":[{"k":"A","t":"Wind"},{"k":"B","t":"Humidity"},{"k":"C","t":"Outlook"},{"k":"D","t":"All three together"}]},{"id":51,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"An overfitted decision tree usually shows:","options":[{"k":"A","t":"Low training accuracy and high test accuracy"},{"k":"B","t":"High training accuracy and low test accuracy"},{"k":"C","t":"Equal training and test accuracy"},{"k":"D","t":"Zero training accuracy"}]},{"id":52,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"The decision tree induction algorithm is:","options":[{"k":"A","t":"Iterative over clusters"},{"k":"B","t":"Based on gradient descent"},{"k":"C","t":"Based on nearest neighbours"},{"k":"D","t":"Recursive: it splits the data and repeats on each subset"}]},{"id":53,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What is the usual effect of pruning a decision tree?","options":[{"k":"A","t":"A smaller tree that generalizes better"},{"k":"B","t":"A larger tree with more leaves"},{"k":"C","t":"Lower accuracy on all data"},{"k":"D","t":"More overfitting"}]},{"id":54,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which are methods of scikit-learn's DecisionTreeClassifier?","options":[{"k":"A","t":"cluster()"},{"k":"B","t":"fit()"},{"k":"C","t":"predict()"},{"k":"D","t":"elbow()"},{"k":"E","t":"predict_proba()"}]},{"id":55,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which scikit-learn function draws a trained decision tree?","options":[{"k":"A","t":"show_tree()"},{"k":"B","t":"draw_graph()"},{"k":"C","t":"plot_tree()"},{"k":"D","t":"roc_curve()"}]},{"id":56,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What does the feature_importances_ attribute of a trained tree show?","options":[{"k":"A","t":"The number of leaves"},{"k":"B","t":"How much each feature contributes to the tree's splits"},{"k":"C","t":"The accuracy of each class"},{"k":"D","t":"The missing values in each feature"}]},{"id":57,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which scikit-learn parameter controls cost-complexity (post-)pruning?","options":[{"k":"A","t":"n_estimators"},{"k":"B","t":"learning_rate"},{"k":"C","t":"n_clusters"},{"k":"D","t":"ccp_alpha"}]},{"id":58,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which is the formula for the Gini index?","options":[{"k":"A","t":"1 − Σ pᵢ²"},{"k":"B","t":"−Σ pᵢ log₂ pᵢ"},{"k":"C","t":"Σ |xᵢ − yᵢ|"},{"k":"D","t":"TP / (TP + FP)"}]},{"id":59,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"A node has 50% \"Yes\" and 50% \"No\". What is its Gini index?","options":[{"k":"A","t":"0"},{"k":"B","t":"1"},{"k":"C","t":"0.5"},{"k":"D","t":"0.25"}]},{"id":60,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which are real applications of decision trees?","options":[{"k":"A","t":"Loan approval"},{"k":"B","t":"Sorting a list of numbers"},{"k":"C","t":"Medical diagnosis"},{"k":"D","t":"Customer churn prediction"},{"k":"E","t":"Compressing a video file"}]},{"id":61,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"A decision tree is called a \"white-box\" model because:","options":[{"k":"A","t":"It only works on white images"},{"k":"B","t":"Its decisions can be easily explained"},{"k":"C","t":"It has no parameters"},{"k":"D","t":"It cannot be visualized"}]},{"id":62,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"If an unpruned tree is trained on noisy data, it will most likely:","options":[{"k":"A","t":"Memorize the noise and overfit"},{"k":"B","t":"Ignore the noise automatically"},{"k":"C","t":"Refuse to train"},{"k":"D","t":"Become a K-Means model"}]},{"id":63,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which attribute is placed at the root node by ID3?","options":[{"k":"A","t":"The one with the lowest information gain"},{"k":"B","t":"The last column in the dataset"},{"k":"C","t":"A random attribute"},{"k":"D","t":"The one with the highest information gain"}]},{"id":64,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"A node has 1 \"Yes\" and 3 \"No\" samples. What is its entropy (approximately)?","options":[{"k":"A","t":"0"},{"k":"B","t":"0.811"},{"k":"C","t":"1.0"},{"k":"D","t":"0.25"}]},{"id":65,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What does it mean when a leaf is \"pure\"?","options":[{"k":"A","t":"It has no samples"},{"k":"B","t":"It has the most features"},{"k":"C","t":"All its samples belong to the same class"},{"k":"D","t":"It has the highest entropy"}]},{"id":66,"type":"cb","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which actions make a decision tree smaller?","options":[{"k":"A","t":"Increasing max_depth"},{"k":"B","t":"Post-pruning"},{"k":"C","t":"Increasing min_samples_leaf"},{"k":"D","t":"Pre-pruning"},{"k":"E","t":"Turning off all pruning"}]},{"id":67,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which scikit-learn class builds a regression tree?","options":[{"k":"A","t":"DecisionTreeRegressor"},{"k":"B","t":"DecisionTreeClassifier"},{"k":"C","t":"LogisticRegression"},{"k":"D","t":"KMeans"}]},{"id":68,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"What does a leaf in a regression tree predict?","options":[{"k":"A","t":"A class label"},{"k":"B","t":"A cluster number"},{"k":"C","t":"The average (mean) of the target values in that leaf"},{"k":"D","t":"The entropy of the leaf"}]},{"id":69,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Which criterion does a regression tree commonly use to choose splits?","options":[{"k":"A","t":"Information gain on class labels"},{"k":"B","t":"Reduction in variance (mean squared error)"},{"k":"C","t":"Support and confidence"},{"k":"D","t":"Silhouette score"}]},{"id":70,"type":"mc","sec":"A","section":"Section A: Entropy & Decision Trees","text":"Decision trees are called \"unstable\" because:","options":[{"k":"A","t":"They crash often"},{"k":"B","t":"They cannot be saved"},{"k":"C","t":"They always change the root to the last feature"},{"k":"D","t":"A small change in the data can produce a very different tree"}]},{"id":71,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"What is customer churn?","options":[{"k":"A","t":"Customers stopping their use of a company's service"},{"k":"B","t":"Customers buying more products"},{"k":"C","t":"New customers joining"},{"k":"D","t":"Customers changing their password"}]},{"id":72,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"How is the churn rate usually calculated?","options":[{"k":"A","t":"New customers ÷ total revenue"},{"k":"B","t":"Total calls ÷ total customers"},{"k":"C","t":"(Customers lost in a period ÷ customers at the start of the period) × 100"},{"k":"D","t":"Profit ÷ number of employees"}]},{"id":73,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Predicting whether a customer will churn is which type of ML task?","options":[{"k":"A","t":"Clustering"},{"k":"B","t":"Binary classification"},{"k":"C","t":"Regression"},{"k":"D","t":"Association rule mining"}]},{"id":74,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"In your course case study, churn prediction was applied in which domain?","options":[{"k":"A","t":"Healthcare"},{"k":"B","t":"Agriculture"},{"k":"C","t":"Software effort estimation"},{"k":"D","t":"Telecom"}]},{"id":75,"type":"cb","sec":"B","section":"Section B: Customer Churn","text":"Which are common reasons customers churn from a telecom company?","options":[{"k":"A","t":"Poor network quality"},{"k":"B","t":"The customer's shoe size"},{"k":"C","t":"High prices"},{"k":"D","t":"Poor customer service"},{"k":"E","t":"Better offers from competitors"}]},{"id":76,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Why do companies try to predict churn?","options":[{"k":"A","t":"To increase the number of complaints"},{"k":"B","t":"Keeping an existing customer is cheaper than winning a new one"},{"k":"C","t":"To delete customer data"},{"k":"D","t":"To slow down their network"}]},{"id":77,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Which of these is NOT a supervised classification algorithm for churn prediction?","options":[{"k":"A","t":"Decision tree"},{"k":"B","t":"Logistic regression"},{"k":"C","t":"K-Means"},{"k":"D","t":"Random forest"}]},{"id":78,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Churn datasets are usually imbalanced. What does this mean?","options":[{"k":"A","t":"Non-churners are far more common than churners"},{"k":"B","t":"Churners are always 50%"},{"k":"C","t":"There are more columns than rows"},{"k":"D","t":"All values are missing"}]},{"id":79,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"In a churn dataset, what does the feature \"tenure\" mean?","options":[{"k":"A","t":"The customer's age"},{"k":"B","t":"The customer's monthly bill"},{"k":"C","t":"The number of complaints"},{"k":"D","t":"How long the customer has been with the company"}]},{"id":80,"type":"cb","sec":"B","section":"Section B: Customer Churn","text":"Which techniques help with class imbalance in churn data?","options":[{"k":"A","t":"Deleting all churners from the data"},{"k":"B","t":"SMOTE (oversampling the minority class)"},{"k":"C","t":"Undersampling the majority class"},{"k":"D","t":"Using class weights in the model"},{"k":"E","t":"Judging the model by accuracy only"}]},{"id":81,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"What does SMOTE stand for?","options":[{"k":"A","t":"Synthetic Minority Over-sampling Technique"},{"k":"B","t":"Simple Model Optimization Test Engine"},{"k":"C","t":"Standard Mean Over Training Error"},{"k":"D","t":"Supervised Multi-Output Tree Estimator"}]},{"id":82,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"What should be done with the Customer ID column before training a churn model?","options":[{"k":"A","t":"Use it as the most important feature"},{"k":"B","t":"Square it"},{"k":"C","t":"Remove it, because it has no predictive value"},{"k":"D","t":"Use it as the target"}]},{"id":83,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"A categorical feature such as \"Contract type\" (Monthly, One year, Two year) must usually be:","options":[{"k":"A","t":"Deleted"},{"k":"B","t":"Encoded into numbers, e.g. one-hot encoding"},{"k":"C","t":"Multiplied by 100"},{"k":"D","t":"Used as the target"}]},{"id":84,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"In churn prediction, what is a false negative?","options":[{"k":"A","t":"The model predicts churn and the customer churns"},{"k":"B","t":"The model predicts stay and the customer stays"},{"k":"C","t":"The model predicts churn but the customer stays"},{"k":"D","t":"The model predicts stay but the customer actually churns"}]},{"id":85,"type":"cb","sec":"B","section":"Section B: Customer Churn","text":"Which are useful behavioural features for churn prediction?","options":[{"k":"A","t":"The customer's name"},{"k":"B","t":"Number of calls to customer support"},{"k":"C","t":"Monthly usage minutes"},{"k":"D","t":"Late payment history"},{"k":"E","t":"Payment method"}]},{"id":86,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Which customer usually has a higher risk of churning?","options":[{"k":"A","t":"A customer on a month-to-month contract"},{"k":"B","t":"A customer on a two-year contract"},{"k":"C","t":"Both have exactly the same risk"},{"k":"D","t":"Neither can ever churn"}]},{"id":87,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"After the model flags a customer as likely to churn, what should the company do?","options":[{"k":"A","t":"Cancel the customer's account"},{"k":"B","t":"Raise their price"},{"k":"C","t":"Offer retention actions such as discounts or a better plan"},{"k":"D","t":"Nothing"}]},{"id":88,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"In most churn datasets, a label value of 1 means:","options":[{"k":"A","t":"The customer stayed"},{"k":"B","t":"The customer churned"},{"k":"C","t":"The customer is new"},{"k":"D","t":"The data is missing"}]},{"id":89,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Why can accuracy be misleading for churn prediction?","options":[{"k":"A","t":"Because accuracy is always 0"},{"k":"B","t":"Because churn data has no labels"},{"k":"C","t":"Because accuracy only works for regression"},{"k":"D","t":"Because the classes are imbalanced"}]},{"id":90,"type":"cb","sec":"B","section":"Section B: Customer Churn","text":"Which metrics are suitable for an imbalanced churn problem?","options":[{"k":"A","t":"Recall"},{"k":"B","t":"Number of rows in the dataset"},{"k":"C","t":"F1-score"},{"k":"D","t":"AUC-ROC"},{"k":"E","t":"Precision"}]},{"id":91,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Why is the churn data split into training and test sets?","options":[{"k":"A","t":"To evaluate the model on data it has not seen"},{"k":"B","t":"To make training faster only"},{"k":"C","t":"To remove churners"},{"k":"D","t":"To create clusters"}]},{"id":92,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Which scikit-learn function splits data into training and test sets?","options":[{"k":"A","t":"split_data()"},{"k":"B","t":"fit_transform()"},{"k":"C","t":"train_test_split()"},{"k":"D","t":"cross_entropy()"}]},{"id":93,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"How does feature importance help in a churn project?","options":[{"k":"A","t":"It increases the dataset size"},{"k":"B","t":"It shows which factors drive churn the most"},{"k":"C","t":"It removes the target column"},{"k":"D","t":"It converts the problem to clustering"}]},{"id":94,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"What is voluntary churn?","options":[{"k":"A","t":"The company closes the customer's account for non-payment"},{"k":"B","t":"The customer dies"},{"k":"C","t":"A data entry error"},{"k":"D","t":"The customer chooses to leave"}]},{"id":95,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"In a telecom churn dataset, each row usually represents:","options":[{"k":"A","t":"One customer"},{"k":"B","t":"One phone call"},{"k":"C","t":"One cell tower"},{"k":"D","t":"One month of revenue"}]},{"id":96,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Which model directly outputs the probability that a customer will churn?","options":[{"k":"A","t":"K-Means"},{"k":"B","t":"Logistic regression"},{"k":"C","t":"Apriori"},{"k":"D","t":"Hierarchical clustering"}]},{"id":97,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"If the churn decision threshold is lowered from 0.5 to 0.3, what usually happens?","options":[{"k":"A","t":"More churners are caught (recall goes up)"},{"k":"B","t":"Fewer churners are caught"},{"k":"C","t":"Nothing changes"},{"k":"D","t":"The model stops working"}]},{"id":98,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Why is Customer Lifetime Value (CLV) used together with churn prediction?","options":[{"k":"A","t":"To delete low-value customers"},{"k":"B","t":"To replace the churn model"},{"k":"C","t":"To focus retention efforts on the most valuable customers"},{"k":"D","t":"To calculate entropy"}]},{"id":99,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Which is an example of involuntary churn?","options":[{"k":"A","t":"A customer moves to a competitor"},{"k":"B","t":"A customer is unhappy with prices"},{"k":"C","t":"A customer dislikes the service"},{"k":"D","t":"The account is closed because of non-payment"}]},{"id":100,"type":"cb","sec":"B","section":"Section B: Customer Churn","text":"Which are steps in a churn prediction ML pipeline?","options":[{"k":"A","t":"Data collection"},{"k":"B","t":"Data cleaning and preprocessing"},{"k":"C","t":"Printing every row on paper"},{"k":"D","t":"Training a classifier"},{"k":"E","t":"Evaluating the model"}]},{"id":101,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"The \"TotalCharges\" column has some blank values. What is a sensible fix?","options":[{"k":"A","t":"Delete the whole column always"},{"k":"B","t":"Convert it to numeric and fill the blanks (e.g. with the median or 0 for new customers)"},{"k":"C","t":"Use it as the target"},{"k":"D","t":"Leave the text blanks inside the model"}]},{"id":102,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"In churn prediction, what does precision tell you?","options":[{"k":"A","t":"How many real churners the model caught"},{"k":"B","t":"How fast the model is"},{"k":"C","t":"Of the customers predicted to churn, how many actually churned"},{"k":"D","t":"How many features were used"}]},{"id":103,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"In churn prediction, what does recall tell you?","options":[{"k":"A","t":"Of all customers who actually churned, how many the model caught"},{"k":"B","t":"Of the customers predicted to churn, how many churned"},{"k":"C","t":"The overall accuracy"},{"k":"D","t":"The training time"}]},{"id":104,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Why might a Random Forest work better than a single decision tree for churn?","options":[{"k":"A","t":"It needs no data"},{"k":"B","t":"It always has 100% accuracy"},{"k":"C","t":"It uses clustering instead of labels"},{"k":"D","t":"Averaging many trees reduces overfitting"}]},{"id":105,"type":"cb","sec":"B","section":"Section B: Customer Churn","text":"Which are realistic data sources for a telecom churn model?","options":[{"k":"A","t":"Billing records"},{"k":"B","t":"Call detail records"},{"k":"C","t":"Weather on Mars"},{"k":"D","t":"Customer complaint logs"},{"k":"E","t":"Demographic information"}]},{"id":106,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"To predict which customers will churn next month, the model is trained on:","options":[{"k":"A","t":"Historical customer data with known churn outcomes"},{"k":"B","t":"Random numbers"},{"k":"C","t":"Next month's data, which is not available yet"},{"k":"D","t":"Only the customer IDs"}]},{"id":107,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Which unsupervised method could group customers into segments before churn analysis?","options":[{"k":"A","t":"Logistic regression"},{"k":"B","t":"Naive Bayes"},{"k":"C","t":"K-Means clustering"},{"k":"D","t":"Linear regression"}]},{"id":108,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"What is the cost of a false positive in churn prediction?","options":[{"k":"A","t":"A churner is missed and leaves"},{"k":"B","t":"A loyal customer receives an unnecessary retention offer"},{"k":"C","t":"The model crashes"},{"k":"D","t":"There is no cost"}]},{"id":109,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Telecom churn prediction is an example of using ML in:","options":[{"k":"A","t":"Computer graphics"},{"k":"B","t":"Robotics hardware"},{"k":"C","t":"Weather forecasting"},{"k":"D","t":"Business and customer relationship management"}]},{"id":110,"type":"cb","sec":"B","section":"Section B: Customer Churn","text":"Which models can directly report feature importance?","options":[{"k":"A","t":"KNN"},{"k":"B","t":"Decision tree"},{"k":"C","t":"Random Forest"},{"k":"D","t":"K-Means"},{"k":"E","t":"Gradient Boosting"}]},{"id":111,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"If the churn rate is 8%, what is the retention rate?","options":[{"k":"A","t":"92%"},{"k":"B","t":"8%"},{"k":"C","t":"100%"},{"k":"D","t":"108%"}]},{"id":112,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"A company starts the month with 1,000 customers and has a 5% monthly churn rate. How many customers does it lose that month?","options":[{"k":"A","t":"5"},{"k":"B","t":"500"},{"k":"C","t":"50"},{"k":"D","t":"95"}]},{"id":113,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"What is the purpose of exploratory data analysis (EDA) before building a churn model?","options":[{"k":"A","t":"To train the final model"},{"k":"B","t":"To understand patterns, distributions and problems in the data"},{"k":"C","t":"To deploy the model"},{"k":"D","t":"To delete the target column"}]},{"id":114,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Which chart best shows the number of churned vs non-churned customers?","options":[{"k":"A","t":"Scatter plot"},{"k":"B","t":"ROC curve"},{"k":"C","t":"Dendrogram"},{"k":"D","t":"Bar chart"}]},{"id":115,"type":"cb","sec":"B","section":"Section B: Customer Churn","text":"Which statements about churn prediction are true?","options":[{"k":"A","t":"It is a supervised learning problem"},{"k":"B","t":"It needs no data"},{"k":"C","t":"It needs historical data with churn labels"},{"k":"D","t":"It can only be solved with K-Means"},{"k":"E","t":"Decision trees can be used for it"}]},{"id":116,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Why use k-fold cross-validation when evaluating a churn model?","options":[{"k":"A","t":"To get a more reliable estimate of performance"},{"k":"B","t":"To make the dataset smaller"},{"k":"C","t":"To remove churners"},{"k":"D","t":"To skip the test set forever"}]},{"id":117,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"What does a stratified train-test split do?","options":[{"k":"A","t":"Puts all churners in the test set"},{"k":"B","t":"Sorts the data by customer ID"},{"k":"C","t":"Keeps the same churn proportion in the training and test sets"},{"k":"D","t":"Removes the minority class"}]},{"id":118,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"Which parameter of train_test_split keeps the class proportions equal?","options":[{"k":"A","t":"shuffle"},{"k":"B","t":"stratify"},{"k":"C","t":"random_state"},{"k":"D","t":"test_size"}]},{"id":119,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"A model gives a customer a churn probability of 0.82. With a threshold of 0.5, what is the prediction?","options":[{"k":"A","t":"Stay"},{"k":"B","t":"Cannot be decided"},{"k":"C","t":"New customer"},{"k":"D","t":"Churn"}]},{"id":120,"type":"mc","sec":"B","section":"Section B: Customer Churn","text":"In a churn dataset, the \"Churn\" column is the:","options":[{"k":"A","t":"Target (label) variable"},{"k":"B","t":"Index column"},{"k":"C","t":"Feature to be removed"},{"k":"D","t":"Cluster number"}]},{"id":121,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"K-Means is which type of algorithm?","options":[{"k":"A","t":"Supervised classification"},{"k":"B","t":"Unsupervised clustering"},{"k":"C","t":"Reinforcement learning"},{"k":"D","t":"Regression"}]},{"id":122,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What does \"K\" stand for in K-Means?","options":[{"k":"A","t":"The number of clusters"},{"k":"B","t":"The number of features"},{"k":"C","t":"The number of iterations"},{"k":"D","t":"The number of rows"}]},{"id":123,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is a centroid in K-Means?","options":[{"k":"A","t":"The first point in the dataset"},{"k":"B","t":"The point farthest from the cluster"},{"k":"C","t":"A randomly chosen label"},{"k":"D","t":"The mean (average) of all points in a cluster"}]},{"id":124,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is the first step of the K-Means algorithm?","options":[{"k":"A","t":"Compute the confusion matrix"},{"k":"B","t":"Calculate information gain"},{"k":"C","t":"Choose k and initialize k centroids"},{"k":"D","t":"Prune the clusters"}]},{"id":125,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Which are steps of the K-Means algorithm?","options":[{"k":"A","t":"Initialize k centroids"},{"k":"B","t":"Calculate information gain"},{"k":"C","t":"Assign each point to its nearest centroid"},{"k":"D","t":"Recompute centroids as the mean of each cluster"},{"k":"E","t":"Repeat until the assignments stop changing"}]},{"id":126,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Which distance does K-Means use by default?","options":[{"k":"A","t":"Cosine distance"},{"k":"B","t":"Euclidean distance"},{"k":"C","t":"Hamming distance"},{"k":"D","t":"Edit distance"}]},{"id":127,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is the Euclidean distance between (0, 0) and (3, 4)?","options":[{"k":"A","t":"7"},{"k":"B","t":"12"},{"k":"C","t":"5"},{"k":"D","t":"25"}]},{"id":128,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"When does K-Means stop (converge)?","options":[{"k":"A","t":"When the centroids no longer change"},{"k":"B","t":"After exactly one iteration"},{"k":"C","t":"When all points are in one cluster"},{"k":"D","t":"When accuracy reaches 100%"}]},{"id":129,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What does K-Means try to minimize?","options":[{"k":"A","t":"The number of clusters"},{"k":"B","t":"Information gain"},{"k":"C","t":"The ROC area"},{"k":"D","t":"The within-cluster sum of squared distances (WCSS / inertia)"}]},{"id":130,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Which are real applications of K-Means?","options":[{"k":"A","t":"Customer segmentation"},{"k":"B","t":"Predicting house prices"},{"k":"C","t":"Image colour compression"},{"k":"D","t":"Grouping similar documents"},{"k":"E","t":"Drawing an ROC curve"}]},{"id":131,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Which scikit-learn class implements K-Means?","options":[{"k":"A","t":"KNeighborsClassifier"},{"k":"B","t":"KMeans"},{"k":"C","t":"DecisionTreeClassifier"},{"k":"D","t":"GaussianNB"}]},{"id":132,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Which KMeans parameter sets the number of clusters?","options":[{"k":"A","t":"n_clusters"},{"k":"B","t":"n_neighbors"},{"k":"C","t":"max_depth"},{"k":"D","t":"n_estimators"}]},{"id":133,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Which KMeans attribute holds the final centroid coordinates?","options":[{"k":"A","t":"labels_"},{"k":"B","t":"inertia_"},{"k":"C","t":"cluster_centers_"},{"k":"D","t":"coef_"}]},{"id":134,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Which KMeans attribute holds the cluster number of each training point?","options":[{"k":"A","t":"cluster_centers_"},{"k":"B","t":"inertia_"},{"k":"C","t":"feature_importances_"},{"k":"D","t":"labels_"}]},{"id":135,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Which KMeans attribute holds the within-cluster sum of squares (WCSS)?","options":[{"k":"A","t":"labels_"},{"k":"B","t":"inertia_"},{"k":"C","t":"n_iter_"},{"k":"D","t":"classes_"}]},{"id":136,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What does the Elbow method plot?","options":[{"k":"A","t":"WCSS (inertia) against the number of clusters k"},{"k":"B","t":"True positive rate against false positive rate"},{"k":"C","t":"Accuracy against tree depth"},{"k":"D","t":"Entropy against information gain"}]},{"id":137,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What does the \"elbow\" point in the Elbow plot suggest?","options":[{"k":"A","t":"The worst value of k"},{"k":"B","t":"That clustering failed"},{"k":"C","t":"A good k, where adding more clusters gives little improvement"},{"k":"D","t":"The number of features"}]},{"id":138,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is the range of the silhouette score?","options":[{"k":"A","t":"0 to 1"},{"k":"B","t":"0 to 100"},{"k":"C","t":"−10 to 10"},{"k":"D","t":"−1 to 1"}]},{"id":139,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"A silhouette score close to 1 means:","options":[{"k":"A","t":"Points are in the wrong clusters"},{"k":"B","t":"Clusters are well separated and compact"},{"k":"C","t":"Clusters overlap completely"},{"k":"D","t":"k is too small"}]},{"id":140,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Why should features usually be scaled before K-Means?","options":[{"k":"A","t":"Distances depend on the scale of each feature"},{"k":"B","t":"K-Means needs labelled data"},{"k":"C","t":"Features with large ranges would dominate the distance"},{"k":"D","t":"Scaling decides k automatically"},{"k":"E","t":"StandardScaler is a common way to do it"}]},{"id":141,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is k-means++?","options":[{"k":"A","t":"A smarter way of choosing the initial centroids"},{"k":"B","t":"A supervised version of K-Means"},{"k":"C","t":"K-Means with labels"},{"k":"D","t":"A tree-based algorithm"}]},{"id":142,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Why is K-Means sensitive to outliers?","options":[{"k":"A","t":"Outliers are deleted automatically"},{"k":"B","t":"It uses the median"},{"k":"C","t":"It ignores distances"},{"k":"D","t":"The mean (centroid) is pulled towards extreme values"}]},{"id":143,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"K-Means works best when clusters are:","options":[{"k":"A","t":"Long and curved"},{"k":"B","t":"Of very different densities"},{"k":"C","t":"Roughly round (spherical) and of similar size"},{"k":"D","t":"Nested inside each other"}]},{"id":144,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is the centroid of the points (1, 2) and (3, 4)?","options":[{"k":"A","t":"(4, 6)"},{"k":"B","t":"(2, 3)"},{"k":"C","t":"(1, 4)"},{"k":"D","t":"(3, 2)"}]},{"id":145,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Which statements about K-Means are true?","options":[{"k":"A","t":"It is unsupervised"},{"k":"B","t":"It always finds the global optimum"},{"k":"C","t":"k must be chosen in advance"},{"k":"D","t":"It may converge to a local optimum"},{"k":"E","t":"It needs labelled data"}]},{"id":146,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"As k increases, what happens to WCSS (inertia)?","options":[{"k":"A","t":"It decreases or stays the same"},{"k":"B","t":"It always increases"},{"k":"C","t":"It becomes negative"},{"k":"D","t":"It does not change at all"}]},{"id":147,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"If k equals the number of data points, what is the WCSS?","options":[{"k":"A","t":"Infinity"},{"k":"B","t":"1"},{"k":"C","t":"100"},{"k":"D","t":"0"}]},{"id":148,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"K-Means is a \"hard clustering\" method. What does this mean?","options":[{"k":"A","t":"It is hard to code"},{"k":"B","t":"Each point can belong to many clusters"},{"k":"C","t":"Each point belongs to exactly one cluster"},{"k":"D","t":"It only works on hard drives"}]},{"id":149,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What does the n_init parameter of KMeans control?","options":[{"k":"A","t":"The number of clusters"},{"k":"B","t":"How many times K-Means runs with different starting centroids"},{"k":"C","t":"The number of features"},{"k":"D","t":"The tree depth"}]},{"id":150,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Which of these are unsupervised learning algorithms?","options":[{"k":"A","t":"Decision tree"},{"k":"B","t":"K-Means"},{"k":"C","t":"Hierarchical clustering"},{"k":"D","t":"Logistic regression"},{"k":"E","t":"DBSCAN"}]},{"id":151,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"After training, how does K-Means assign a new point to a cluster?","options":[{"k":"A","t":"It assigns it to the nearest centroid"},{"k":"B","t":"It retrains from scratch"},{"k":"C","t":"It asks the user"},{"k":"D","t":"It uses majority voting of k neighbours"}]},{"id":152,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What are the clusters produced by K-Means called?","options":[{"k":"A","t":"Class names given in the data"},{"k":"B","t":"Leaf labels"},{"k":"C","t":"Decision rules"},{"k":"D","t":"Numbered groups (0 to k−1) without meaningful names"}]},{"id":153,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Before K-Means, a categorical column such as \"City\" should be:","options":[{"k":"A","t":"Used as it is"},{"k":"B","t":"Squared"},{"k":"C","t":"Encoded into numbers"},{"k":"D","t":"Used as k"}]},{"id":154,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is the Manhattan distance between (1, 2) and (4, 6)?","options":[{"k":"A","t":"5"},{"k":"B","t":"7"},{"k":"C","t":"25"},{"k":"D","t":"12"}]},{"id":155,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"K-Means belongs to which family of clustering methods?","options":[{"k":"A","t":"Partitioning (centroid-based)"},{"k":"B","t":"Hierarchical"},{"k":"C","t":"Density-based"},{"k":"D","t":"Rule-based"}]},{"id":156,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"How does K-Means reach its final clusters?","options":[{"k":"A","t":"In a single pass over the data"},{"k":"B","t":"By building a tree of splits"},{"k":"C","t":"Iteratively, repeating assignment and update steps"},{"k":"D","t":"By voting among neighbours"}]},{"id":157,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Because K-Means starts with random centroids, it can:","options":[{"k":"A","t":"Give different results on different runs"},{"k":"B","t":"Never converge"},{"k":"C","t":"Only produce one cluster"},{"k":"D","t":"Need labels"}]},{"id":158,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Why set random_state in scikit-learn's KMeans?","options":[{"k":"A","t":"To choose k automatically"},{"k":"B","t":"To scale the features"},{"k":"C","t":"To remove outliers"},{"k":"D","t":"To make the results reproducible"}]},{"id":159,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Centroids are C1 = (4, 4) and C2 = (8, 8). Which cluster is the point (5, 5) assigned to?","options":[{"k":"A","t":"C2"},{"k":"B","t":"C1"},{"k":"C","t":"Both"},{"k":"D","t":"Neither"}]},{"id":160,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Which can help choose the number of clusters k?","options":[{"k":"A","t":"Elbow method"},{"k":"B","t":"ROC curve"},{"k":"C","t":"Silhouette analysis"},{"k":"D","t":"Domain knowledge"},{"k":"E","t":"Information gain"}]},{"id":161,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"During K-Means iterations, the WCSS (inertia):","options":[{"k":"A","t":"Always increases"},{"k":"B","t":"Jumps randomly"},{"k":"C","t":"Never increases"},{"k":"D","t":"Becomes negative"}]},{"id":162,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"When does an \"empty cluster\" occur in K-Means?","options":[{"k":"A","t":"When k is 1"},{"k":"B","t":"When the data is scaled"},{"k":"C","t":"When all points are identical"},{"k":"D","t":"When no points are assigned to a centroid"}]},{"id":163,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"For n points, k clusters and d features, the cost of one K-Means iteration is roughly:","options":[{"k":"A","t":"O(n · k · d)"},{"k":"B","t":"O(1)"},{"k":"C","t":"O(n³)"},{"k":"D","t":"O(k only)"}]},{"id":164,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Which K-Means variant uses actual data points as cluster centres?","options":[{"k":"A","t":"K-Means++"},{"k":"B","t":"K-Medoids"},{"k":"C","t":"Mini-Batch K-Means"},{"k":"D","t":"DBSCAN"}]},{"id":165,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Which are disadvantages of K-Means?","options":[{"k":"A","t":"It struggles with non-spherical clusters"},{"k":"B","t":"k must be given in advance"},{"k":"C","t":"It cannot handle numerical data"},{"k":"D","t":"It is sensitive to outliers"},{"k":"E","t":"It is sensitive to the initial centroids"}]},{"id":166,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is Mini-Batch K-Means?","options":[{"k":"A","t":"K-Means with labels"},{"k":"B","t":"K-Means for one point only"},{"k":"C","t":"A faster version that updates centroids using small random batches of data"},{"k":"D","t":"A tree-based clustering method"}]},{"id":167,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"When K-Means is used for image colour compression, k represents:","options":[{"k":"A","t":"The number of colours kept in the image"},{"k":"B","t":"The image width"},{"k":"C","t":"The number of images"},{"k":"D","t":"The file size"}]},{"id":168,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Which pair of features is commonly used for customer segmentation with K-Means?","options":[{"k":"A","t":"Customer ID and phone number"},{"k":"B","t":"Name and address"},{"k":"C","t":"Password and email"},{"k":"D","t":"Annual income and spending score"}]},{"id":169,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"How can K-Means cluster labels help a supervised model?","options":[{"k":"A","t":"They replace the target column"},{"k":"B","t":"They can be added as a new feature"},{"k":"C","t":"They delete outliers"},{"k":"D","t":"They cannot be used at all"}]},{"id":170,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Which statements about K-Means centroids are true?","options":[{"k":"A","t":"Centroids are fixed after initialization"},{"k":"B","t":"A centroid is the mean of its cluster's points"},{"k":"C","t":"A centroid need not be an actual data point"},{"k":"D","t":"Centroids are recomputed every iteration"},{"k":"E","t":"A centroid must be one of the data points"}]},{"id":171,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"A good clustering has:","options":[{"k":"A","t":"Large distances within clusters and small distances between clusters"},{"k":"B","t":"Equal distances everywhere"},{"k":"C","t":"Small distances within clusters and large distances between clusters"},{"k":"D","t":"Only one cluster"}]},{"id":172,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"Which of these does K-Means NOT need?","options":[{"k":"A","t":"Class labels"},{"k":"B","t":"Numerical features"},{"k":"C","t":"The value of k"},{"k":"D","t":"A distance measure"}]},{"id":173,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"A scatter plot clearly shows three separate groups of points. Which k is most suitable?","options":[{"k":"A","t":"1"},{"k":"B","t":"10"},{"k":"C","t":"100"},{"k":"D","t":"3"}]},{"id":174,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"A dendrogram is used in:","options":[{"k":"A","t":"K-Means"},{"k":"B","t":"Hierarchical clustering"},{"k":"C","t":"Logistic regression"},{"k":"D","t":"ROC analysis"}]},{"id":175,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Which tools are typically used in a K-Means lab in Python?","options":[{"k":"A","t":"sklearn.cluster.KMeans"},{"k":"B","t":"StandardScaler"},{"k":"C","t":"silhouette_score"},{"k":"D","t":"DecisionTreeClassifier"},{"k":"E","t":"matplotlib to plot the clusters"}]},{"id":176,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What does KMeans.fit_predict(X) do?","options":[{"k":"A","t":"Fits the model and returns the cluster label of each point"},{"k":"B","t":"Returns only the centroids"},{"k":"C","t":"Returns the accuracy"},{"k":"D","t":"Scales the data"}]},{"id":177,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is the centroid of (2, 2), (4, 2) and (6, 8)?","options":[{"k":"A","t":"(6, 6)"},{"k":"B","t":"(12, 12)"},{"k":"C","t":"(4, 4)"},{"k":"D","t":"(2, 8)"}]},{"id":178,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"The 1-D points 1, 2, 3, 10, 11, 12 are clustered with k = 2. What are the final centroids?","options":[{"k":"A","t":"1 and 12"},{"k":"B","t":"3 and 10"},{"k":"C","t":"6.5 and 6.5"},{"k":"D","t":"2 and 11"}]},{"id":179,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is inertia in K-Means?","options":[{"k":"A","t":"The number of iterations"},{"k":"B","t":"The sum of squared distances of points to their cluster centroid"},{"k":"C","t":"The number of clusters"},{"k":"D","t":"The accuracy of the clusters"}]},{"id":180,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Which are signs of a good clustering result?","options":[{"k":"A","t":"Low inertia for the chosen k"},{"k":"B","t":"A high silhouette score"},{"k":"C","t":"A negative silhouette score"},{"k":"D","t":"Clear separation between groups in a scatter plot"},{"k":"E","t":"Points in the same cluster being very far apart"}]},{"id":181,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"A point has a negative silhouette value. What does this suggest?","options":[{"k":"A","t":"It is the centroid"},{"k":"B","t":"It is perfectly clustered"},{"k":"C","t":"It is probably in the wrong cluster"},{"k":"D","t":"k is correct"}]},{"id":182,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is the main difference between K-Means and KNN?","options":[{"k":"A","t":"K-Means is unsupervised clustering; KNN is supervised classification"},{"k":"B","t":"Both are clustering methods"},{"k":"C","t":"Both are supervised methods"},{"k":"D","t":"K-Means needs labels; KNN does not"}]},{"id":183,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What does the max_iter parameter of KMeans control?","options":[{"k":"A","t":"The number of clusters"},{"k":"B","t":"The number of features"},{"k":"C","t":"The size of the test set"},{"k":"D","t":"The maximum number of iterations in one run"}]},{"id":184,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"In the lab course outline, K-Means falls under which week's topic?","options":[{"k":"A","t":"Supervised learning algorithms"},{"k":"B","t":"Unsupervised learning algorithms"},{"k":"C","t":"Reinforcement learning"},{"k":"D","t":"Computer vision"}]},{"id":185,"type":"cb","sec":"C","section":"Section C: K-Means Clustering","text":"Which of these are distance measures?","options":[{"k":"A","t":"Euclidean"},{"k":"B","t":"Entropy"},{"k":"C","t":"Manhattan"},{"k":"D","t":"Minkowski"},{"k":"E","t":"Cosine"}]},{"id":186,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is the Euclidean distance between (1, 1) and (4, 5)?","options":[{"k":"A","t":"7"},{"k":"B","t":"5"},{"k":"C","t":"25"},{"k":"D","t":"3"}]},{"id":187,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"K-Means is run on unscaled data with Salary (in thousands) and Age (in years). What happens?","options":[{"k":"A","t":"Age dominates the clusters"},{"k":"B","t":"Both features count equally"},{"k":"C","t":"Salary dominates the distances and the clusters"},{"k":"D","t":"K-Means refuses to run"}]},{"id":188,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What is the main goal of clustering?","options":[{"k":"A","t":"To group similar data points together"},{"k":"B","t":"To predict a labelled target"},{"k":"C","t":"To sort data alphabetically"},{"k":"D","t":"To increase the number of features"}]},{"id":189,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"After K-Means groups customers into 3 clusters, what should the analyst do next?","options":[{"k":"A","t":"Delete the smallest cluster"},{"k":"B","t":"Rename the features"},{"k":"C","t":"Retrain with k = 100"},{"k":"D","t":"Interpret each cluster's characteristics (e.g. high spenders, budget buyers)"}]},{"id":190,"type":"mc","sec":"C","section":"Section C: K-Means Clustering","text":"What does k-means++ initialization usually improve?","options":[{"k":"A","t":"The number of features"},{"k":"B","t":"Convergence speed and cluster quality"},{"k":"C","t":"The number of labels"},{"k":"D","t":"The test accuracy of a classifier"}]},{"id":191,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is a confusion matrix used for?","options":[{"k":"A","t":"Evaluating the performance of a classification model"},{"k":"B","t":"Clustering data"},{"k":"C","t":"Choosing k in K-Means"},{"k":"D","t":"Cleaning missing values"}]},{"id":192,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is a True Positive (TP)?","options":[{"k":"A","t":"Predicted negative, actually negative"},{"k":"B","t":"Predicted negative, actually positive"},{"k":"C","t":"Predicted positive, actually positive"},{"k":"D","t":"Predicted positive, actually negative"}]},{"id":193,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is a True Negative (TN)?","options":[{"k":"A","t":"Predicted positive, actually positive"},{"k":"B","t":"Predicted negative, actually negative"},{"k":"C","t":"Predicted positive, actually negative"},{"k":"D","t":"Predicted negative, actually positive"}]},{"id":194,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A False Positive (FP) is also called a:","options":[{"k":"A","t":"Type II error"},{"k":"B","t":"Correct rejection"},{"k":"C","t":"Hit"},{"k":"D","t":"Type I error"}]},{"id":195,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which are the four cells of a binary confusion matrix?","options":[{"k":"A","t":"True Positive"},{"k":"B","t":"WCSS"},{"k":"C","t":"False Positive"},{"k":"D","t":"True Negative"},{"k":"E","t":"False Negative"}]},{"id":196,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A False Negative (FN) is also called a:","options":[{"k":"A","t":"Type II error"},{"k":"B","t":"Type I error"},{"k":"C","t":"True rejection"},{"k":"D","t":"Bias"}]},{"id":197,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is the formula for accuracy?","options":[{"k":"A","t":"TP / (TP + FP)"},{"k":"B","t":"TP / (TP + FN)"},{"k":"C","t":"(TP + TN) / (TP + TN + FP + FN)"},{"k":"D","t":"TN / (TN + FP)"}]},{"id":198,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is the formula for precision?","options":[{"k":"A","t":"TP / (TP + FN)"},{"k":"B","t":"TP / (TP + FP)"},{"k":"C","t":"TN / (TN + FP)"},{"k":"D","t":"(TP + TN) / Total"}]},{"id":199,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is the formula for recall?","options":[{"k":"A","t":"TP / (TP + FP)"},{"k":"B","t":"TN / (TN + FN)"},{"k":"C","t":"FP / (FP + TN)"},{"k":"D","t":"TP / (TP + FN)"}]},{"id":200,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Recall is also known as:","options":[{"k":"A","t":"Sensitivity"},{"k":"B","t":"Specificity"},{"k":"C","t":"True positive rate (TPR)"},{"k":"D","t":"Hit rate"},{"k":"E","t":"Precision"}]},{"id":201,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is the formula for specificity?","options":[{"k":"A","t":"TN / (TN + FP)"},{"k":"B","t":"TP / (TP + FN)"},{"k":"C","t":"FP / (FP + TN)"},{"k":"D","t":"TP / (TP + FP)"}]},{"id":202,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"The F1-score is the:","options":[{"k":"A","t":"Arithmetic mean of accuracy and recall"},{"k":"B","t":"Product of precision and recall"},{"k":"C","t":"Harmonic mean of precision and recall"},{"k":"D","t":"Difference between TP and FP"}]},{"id":203,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which is the formula for the F1-score?","options":[{"k":"A","t":"(P + R) / 2"},{"k":"B","t":"2 × P × R / (P + R)"},{"k":"C","t":"P × R"},{"k":"D","t":"P − R"}]},{"id":204,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"If precision = 0.5 and recall = 0.5, what is the F1-score?","options":[{"k":"A","t":"0.25"},{"k":"B","t":"1.0"},{"k":"C","t":"0.75"},{"k":"D","t":"0.5"}]},{"id":205,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A classifier has TP = 50, FP = 10, FN = 5, TN = 35. Which values are correct?","options":[{"k":"A","t":"Accuracy = 0.85"},{"k":"B","t":"Precision ≈ 0.83"},{"k":"C","t":"Recall ≈ 0.91"},{"k":"D","t":"Specificity = 0.90"},{"k":"E","t":"False positive rate = 0.10"}]},{"id":206,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"For a 3-class problem, what is the size of the confusion matrix?","options":[{"k":"A","t":"3 × 3"},{"k":"B","t":"2 × 2"},{"k":"C","t":"3 × 1"},{"k":"D","t":"9 × 9"}]},{"id":207,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What do the diagonal cells of a confusion matrix show?","options":[{"k":"A","t":"All errors"},{"k":"B","t":"Missing values"},{"k":"C","t":"Feature importances"},{"k":"D","t":"Correct predictions"}]},{"id":208,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which scikit-learn function computes a confusion matrix?","options":[{"k":"A","t":"accuracy_matrix()"},{"k":"B","t":"confusion_matrix()"},{"k":"C","t":"error_table()"},{"k":"D","t":"roc_matrix()"}]},{"id":209,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What does scikit-learn's classification_report show?","options":[{"k":"A","t":"Only the accuracy"},{"k":"B","t":"The centroids"},{"k":"C","t":"Precision, recall, F1-score and support for each class"},{"k":"D","t":"The tree structure"}]},{"id":210,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which metrics can be calculated from a confusion matrix?","options":[{"k":"A","t":"Silhouette score"},{"k":"B","t":"Accuracy"},{"k":"C","t":"Precision"},{"k":"D","t":"Recall"},{"k":"E","t":"F1-score"}]},{"id":211,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"High precision means the model has:","options":[{"k":"A","t":"Few false positives"},{"k":"B","t":"Few false negatives"},{"k":"C","t":"Few true positives"},{"k":"D","t":"Many false positives"}]},{"id":212,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"High recall means the model has:","options":[{"k":"A","t":"Few true negatives"},{"k":"B","t":"Many false negatives"},{"k":"C","t":"Few false positives"},{"k":"D","t":"Few false negatives"}]},{"id":213,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"For a test that detects a serious disease, which metric is usually most important?","options":[{"k":"A","t":"Precision"},{"k":"B","t":"Recall"},{"k":"C","t":"Specificity"},{"k":"D","t":"Training time"}]},{"id":214,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A model has TP = 30 and FP = 0. What is its precision?","options":[{"k":"A","t":"0"},{"k":"B","t":"0.5"},{"k":"C","t":"1.0"},{"k":"D","t":"30"}]},{"id":215,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"If the classification threshold is raised, what usually happens?","options":[{"k":"A","t":"Precision rises and recall falls"},{"k":"B","t":"Both precision and recall rise"},{"k":"C","t":"Recall rises and precision falls"},{"k":"D","t":"Nothing changes"}]},{"id":216,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A model has TP = 45 and TN = 45 out of 100 samples. What is its accuracy?","options":[{"k":"A","t":"0.45"},{"k":"B","t":"0.50"},{"k":"C","t":"0.10"},{"k":"D","t":"0.90"}]},{"id":217,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"In a classification report, what does \"support\" mean?","options":[{"k":"A","t":"The model's confidence"},{"k":"B","t":"The number of actual samples of each class"},{"k":"C","t":"The number of features"},{"k":"D","t":"The number of trees"}]},{"id":218,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is the formula for the false positive rate (FPR)?","options":[{"k":"A","t":"TP / (TP + FN)"},{"k":"B","t":"FN / (FN + TP)"},{"k":"C","t":"FP / (FP + TN)"},{"k":"D","t":"TN / (TN + FP)"}]},{"id":219,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"The false positive rate is equal to:","options":[{"k":"A","t":"1 − specificity"},{"k":"B","t":"1 − recall"},{"k":"C","t":"1 − precision"},{"k":"D","t":"1 − accuracy"}]},{"id":220,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"In which situations is accuracy NOT a good metric on its own?","options":[{"k":"A","t":"Highly imbalanced classes"},{"k":"B","t":"Balanced classes where both errors cost the same"},{"k":"C","t":"Fraud detection, where fraud is rare"},{"k":"D","t":"When false negatives cost much more than false positives"},{"k":"E","t":"Rare disease detection"}]},{"id":221,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A model has TP = 20 and FN = 5. What is its recall?","options":[{"k":"A","t":"0.25"},{"k":"B","t":"0.80"},{"k":"C","t":"0.20"},{"k":"D","t":"1.00"}]},{"id":222,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A model has TP = 20 and FP = 20. What is its precision?","options":[{"k":"A","t":"1.0"},{"k":"B","t":"0.2"},{"k":"C","t":"0.0"},{"k":"D","t":"0.5"}]},{"id":223,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"In scikit-learn's confusion_matrix output, what do the rows represent?","options":[{"k":"A","t":"The actual (true) classes"},{"k":"B","t":"The predicted classes"},{"k":"C","t":"The features"},{"k":"D","t":"The thresholds"}]},{"id":224,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is ConfusionMatrixDisplay used for in scikit-learn?","options":[{"k":"A","t":"Training a model"},{"k":"B","t":"Scaling data"},{"k":"C","t":"Plotting a confusion matrix"},{"k":"D","t":"Choosing k"}]},{"id":225,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which are examples of a Type II error (false negative)?","options":[{"k":"A","t":"A sick patient is told they are healthy"},{"k":"B","t":"A healthy patient is told they are sick"},{"k":"C","t":"A fraud transaction is marked as normal"},{"k":"D","t":"A legitimate email is sent to spam"},{"k":"E","t":"A spam email reaches the inbox (spam = positive class)"}]},{"id":226,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is balanced accuracy?","options":[{"k":"A","t":"Accuracy on the training set"},{"k":"B","t":"Accuracy multiplied by 2"},{"k":"C","t":"Precision divided by recall"},{"k":"D","t":"The average of recall over all classes"}]},{"id":227,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A perfect classifier has:","options":[{"k":"A","t":"FP = FN = 50"},{"k":"B","t":"FP = 0 and FN = 0"},{"k":"C","t":"TP = 0"},{"k":"D","t":"Accuracy = 0.5"}]},{"id":228,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"In a classification report, what is the \"macro average\"?","options":[{"k":"A","t":"The simple (unweighted) mean of a metric across classes"},{"k":"B","t":"The mean weighted by the number of samples"},{"k":"C","t":"The maximum value over classes"},{"k":"D","t":"The metric for the largest class only"}]},{"id":229,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"In a classification report, what is the \"weighted average\"?","options":[{"k":"A","t":"The maximum value over classes"},{"k":"B","t":"The value for the smallest class"},{"k":"C","t":"The mean of a metric weighted by each class's support"},{"k":"D","t":"The median of all metrics"}]},{"id":230,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A model predicts \"negative\" for every sample. What is its recall?","options":[{"k":"A","t":"1"},{"k":"B","t":"0.5"},{"k":"C","t":"It equals the accuracy"},{"k":"D","t":"0"}]},{"id":231,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What does ROC stand for?","options":[{"k":"A","t":"Rate of Classification"},{"k":"B","t":"Receiver Operating Characteristic"},{"k":"C","t":"Regression Output Curve"},{"k":"D","t":"Random Outcome Chart"}]},{"id":232,"type":
