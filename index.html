id":484,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Opinion mining is another name for:","options":[{"k":"A","t":"Data cleaning"},{"k":"B","t":"Sentiment analysis"},{"k":"C","t":"Association rule mining"},{"k":"D","t":"Clustering"}]},{"id":485,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which are typical aspects in tourist hotel reviews?","options":[{"k":"A","t":"Location"},{"k":"B","t":"Cleanliness"},{"k":"C","t":"Entropy"},{"k":"D","t":"Staff service"},{"k":"E","t":"Price / value for money"}]},{"id":486,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is the sentiment of the review \"The view from the hotel was amazing\"?","options":[{"k":"A","t":"Negative"},{"k":"B","t":"Neutral"},{"k":"C","t":"Positive"},{"k":"D","t":"Cannot be determined"}]},{"id":487,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Why is sarcasm a challenge in sentiment analysis?","options":[{"k":"A","t":"Positive words can express a negative opinion, e.g. \"Great, the room was dirty\""},{"k":"B","t":"Sarcastic reviews have no words"},{"k":"C","t":"Sarcasm only appears in numbers"},{"k":"D","t":"It is not a challenge"}]},{"id":488,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is a key advantage of deep learning?","options":[{"k":"A","t":"It needs no data"},{"k":"B","t":"It learns useful features automatically from raw data"},{"k":"C","t":"It is always easy to interpret"},{"k":"D","t":"It needs no computing power"}]},{"id":489,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does training a deep neural network usually require?","options":[{"k":"A","t":"Only 10 samples"},{"k":"B","t":"No hardware"},{"k":"C","t":"Only text data"},{"k":"D","t":"Large amounts of data and computing power (e.g. GPUs)"}]},{"id":490,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which are deep learning frameworks?","options":[{"k":"A","t":"TensorFlow"},{"k":"B","t":"Excel"},{"k":"C","t":"Keras"},{"k":"D","t":"PyTorch"},{"k":"E","t":"Notepad"}]},{"id":491,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"In neural network training, what is an epoch?","options":[{"k":"A","t":"One weight update"},{"k":"B","t":"One layer"},{"k":"C","t":"One complete pass through the entire training data"},{"k":"D","t":"One neuron"}]},{"id":492,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is the batch size?","options":[{"k":"A","t":"The number of samples used for each weight update"},{"k":"B","t":"The number of layers"},{"k":"C","t":"The number of epochs"},{"k":"D","t":"The number of classes"}]},{"id":493,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does dropout do in a neural network?","options":[{"k":"A","t":"Deletes the dataset"},{"k":"B","t":"Removes the output layer"},{"k":"C","t":"Stops training early"},{"k":"D","t":"Randomly turns off neurons during training to reduce overfitting"}]},{"id":494,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which loss function is commonly used for binary classification?","options":[{"k":"A","t":"Mean squared error only"},{"k":"B","t":"Binary cross-entropy"},{"k":"C","t":"Gini index"},{"k":"D","t":"Inertia"}]},{"id":495,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Where is the softmax function usually used?","options":[{"k":"A","t":"In the input layer"},{"k":"B","t":"In data cleaning"},{"k":"C","t":"In the output layer, to give probabilities for multiple classes"},{"k":"D","t":"In K-Means"}]},{"id":496,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does NLP stand for?","options":[{"k":"A","t":"Neural Layer Processing"},{"k":"B","t":"Natural Language Processing"},{"k":"C","t":"New Learning Program"},{"k":"D","t":"Numeric Logic Processing"}]},{"id":497,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is tokenization in NLP?","options":[{"k":"A","t":"Splitting text into words or tokens"},{"k":"B","t":"Translating text"},{"k":"C","t":"Encrypting text"},{"k":"D","t":"Counting sentences only"}]},{"id":498,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What are word embeddings such as Word2Vec?","options":[{"k":"A","t":"Lists of stop words"},{"k":"B","t":"Spelling correctors"},{"k":"C","t":"Images of words"},{"k":"D","t":"Dense vectors that represent words and capture their meaning"}]},{"id":499,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does Named Entity Recognition (NER) do?","options":[{"k":"A","t":"Removes names from text"},{"k":"B","t":"Translates names"},{"k":"C","t":"Identifies names of people, places and organizations in text"},{"k":"D","t":"Counts the number of words"}]},{"id":500,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which are applications of NLP?","options":[{"k":"A","t":"Machine translation"},{"k":"B","t":"Chatbots"},{"k":"C","t":"Sentiment analysis"},{"k":"D","t":"Image denoising"},{"k":"E","t":"Spam filtering"}]},{"id":501,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is computer vision?","options":[{"k":"A","t":"The field of enabling computers to understand images and videos"},{"k":"B","t":"Building computer screens"},{"k":"C","t":"Designing graphics cards"},{"k":"D","t":"Processing audio"}]},{"id":502,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does CNN stand for in deep learning?","options":[{"k":"A","t":"Cable News Network"},{"k":"B","t":"Central Neural Node"},{"k":"C","t":"Convolutional Neural Network"},{"k":"D","t":"Clustered Nearest Neighbors"}]},{"id":503,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does a convolutional layer do?","options":[{"k":"A","t":"Outputs the final class"},{"k":"B","t":"Extracts features such as edges and textures using filters"},{"k":"C","t":"Deletes pixels"},{"k":"D","t":"Computes the ROC curve"}]},{"id":504,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does a pooling layer do in a CNN?","options":[{"k":"A","t":"Adds more pixels"},{"k":"B","t":"Changes the image colour"},{"k":"C","t":"Labels the image"},{"k":"D","t":"Reduces the spatial size of the feature maps"}]},{"id":505,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which are computer vision tasks?","options":[{"k":"A","t":"Image classification"},{"k":"B","t":"Object detection"},{"k":"C","t":"Sentiment of a tweet"},{"k":"D","t":"Image segmentation"},{"k":"E","t":"Face recognition"}]},{"id":506,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"How is an image represented for a computer?","options":[{"k":"A","t":"As a sentence"},{"k":"B","t":"As a single number"},{"k":"C","t":"As a matrix (array) of pixel values"},{"k":"D","t":"As a decision tree"}]},{"id":507,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is data augmentation in computer vision?","options":[{"k":"A","t":"Creating modified copies of images (flip, rotate, zoom) to enlarge the training data"},{"k":"B","t":"Deleting blurry images"},{"k":"C","t":"Reducing image size only"},{"k":"D","t":"Labelling images by hand"}]},{"id":508,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is transfer learning?","options":[{"k":"A","t":"Moving data between computers"},{"k":"B","t":"Training from scratch every time"},{"k":"C","t":"Copying the test set into training"},{"k":"D","t":"Reusing a model pretrained on a large dataset for a new task"}]},{"id":509,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is reinforcement learning?","options":[{"k":"A","t":"Learning from labelled examples only"},{"k":"B","t":"An agent learning by interacting with an environment and receiving rewards"},{"k":"C","t":"Grouping data into clusters"},{"k":"D","t":"Finding association rules"}]},{"id":510,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which are core elements of reinforcement learning?","options":[{"k":"A","t":"Agent"},{"k":"B","t":"Environment"},{"k":"C","t":"Labelled answers for every input"},{"k":"D","t":"Action"},{"k":"E","t":"Reward"}]},{"id":511,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"In reinforcement learning, what is a policy?","options":[{"k":"A","t":"A dataset"},{"k":"B","t":"A reward value"},{"k":"C","t":"The agent's strategy for choosing actions in each state"},{"k":"D","t":"A loss function"}]},{"id":512,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is the exploration vs exploitation trade-off?","options":[{"k":"A","t":"Trying new actions vs using the best-known action"},{"k":"B","t":"Training vs testing"},{"k":"C","t":"Precision vs recall"},{"k":"D","t":"Clustering vs classification"}]},{"id":513,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does Q-learning learn?","options":[{"k":"A","t":"Cluster centres"},{"k":"B","t":"Word counts"},{"k":"C","t":"Decision tree splits"},{"k":"D","t":"Q-values: the expected future reward of each state-action pair"}]},{"id":514,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does the discount factor (gamma) control in RL?","options":[{"k":"A","t":"The learning rate"},{"k":"B","t":"How much future rewards count compared with immediate rewards"},{"k":"C","t":"The number of actions"},{"k":"D","t":"The size of the environment"}]},{"id":515,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which are applications of reinforcement learning?","options":[{"k":"A","t":"Game playing"},{"k":"B","t":"Robot control"},{"k":"C","t":"Computing a confusion matrix"},{"k":"D","t":"Autonomous driving decisions"},{"k":"E","t":"Traffic-signal control"}]},{"id":516,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is feature engineering?","options":[{"k":"A","t":"Building computer hardware"},{"k":"B","t":"Deleting all features"},{"k":"C","t":"Creating or transforming features to improve model performance"},{"k":"D","t":"Choosing the learning rate"}]},{"id":517,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which is an example of feature engineering?","options":[{"k":"A","t":"Extracting \"day of the week\" from a date column"},{"k":"B","t":"Buying a faster computer"},{"k":"C","t":"Changing the model's name"},{"k":"D","t":"Deleting the test set"}]},{"id":518,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is feature selection?","options":[{"k":"A","t":"Adding random features"},{"k":"B","t":"Choosing the model type"},{"k":"C","t":"Collecting more rows"},{"k":"D","t":"Choosing the most relevant features and dropping the rest"}]},{"id":519,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does PCA (Principal Component Analysis) do?","options":[{"k":"A","t":"Classifies data"},{"k":"B","t":"Reduces dimensionality by projecting data onto principal components"},{"k":"C","t":"Clusters data into k groups"},{"k":"D","t":"Generates association rules"}]},{"id":520,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which are feature engineering techniques?","options":[{"k":"A","t":"One-hot encoding"},{"k":"B","t":"Feature scaling"},{"k":"C","t":"Deleting the target column"},{"k":"D","t":"Creating interaction features"},{"k":"E","t":"Binning continuous values"}]},{"id":521,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Why is a log transform applied to a feature?","options":[{"k":"A","t":"To create labels"},{"k":"B","t":"To remove the feature"},{"k":"C","t":"To reduce skewness in its values"},{"k":"D","t":"To make it categorical"}]},{"id":522,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is binning?","options":[{"k":"A","t":"Converting a continuous feature into categories, e.g. age groups"},{"k":"B","t":"Deleting outliers"},{"k":"C","t":"Splitting data into train and test"},{"k":"D","t":"Saving the model"}]},{"id":523,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"How can the curse of dimensionality be reduced?","options":[{"k":"A","t":"By adding more features"},{"k":"B","t":"By using a larger k"},{"k":"C","t":"By removing the labels"},{"k":"D","t":"By dimensionality reduction or feature selection"}]},{"id":524,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is model deployment?","options":[{"k":"A","t":"Training the model again"},{"k":"B","t":"Making a trained model available for real use, e.g. through an app or API"},{"k":"C","t":"Deleting the model"},{"k":"D","t":"Splitting the data"}]},{"id":525,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which methods reduce overfitting?","options":[{"k":"A","t":"More training data"},{"k":"B","t":"Regularization"},{"k":"C","t":"Making the model much more complex"},{"k":"D","t":"Early stopping"},{"k":"E","t":"Dropout"}]},{"id":526,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"How is a trained scikit-learn model usually saved to a file?","options":[{"k":"A","t":"As a screenshot"},{"k":"B","t":"By printing it"},{"k":"C","t":"With joblib or pickle"},{"k":"D","t":"It cannot be saved"}]},{"id":527,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which is an important ethical concern in machine learning?","options":[{"k":"A","t":"Bias that leads to unfair predictions for some groups of people"},{"k":"B","t":"Models being too fast"},{"k":"C","t":"Using Python"},{"k":"D","t":"Having too many test samples"}]},{"id":528,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is explainable AI (XAI)?","options":[{"k":"A","t":"AI that writes explanations of movies"},{"k":"B","t":"AI without any model"},{"k":"C","t":"AI that only uses decision trees"},{"k":"D","t":"Methods that make a model's decisions understandable to humans"}]},{"id":529,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is model drift?","options":[{"k":"A","t":"The model moving to another server"},{"k":"B","t":"Model performance dropping over time because real-world data changes"},{"k":"C","t":"The model getting faster"},{"k":"D","t":"Adding more layers"}]},{"id":530,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"In the lab course outline, which topic is covered in Week 14, just before the final paper?","options":[{"k":"A","t":"Computer vision"},{"k":"B","t":"Reinforcement learning"},{"k":"C","t":"Feature engineering"},{"k":"D","t":"Data preprocessing"}]}];

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = id => document.getElementById(id);
const STORE_KEY = "quizState_" + CONFIG.QUIZ_ID;
const DONE_KEY  = "quizDone_"  + CONFIG.QUIZ_ID;

function show(id) {
  ["scrRegister","scrRules","scrQuiz","scrDone"].forEach(s => $(s).classList.toggle("hidden", s !== id));
}
function shuffle(arr) {               // Fisher–Yates, using crypto randomness
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const r = new Uint32Array(1); crypto.getRandomValues(r);
    const j = r[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; } }

// Simple modal; returns a Promise<boolean>
function modal(title, text, withCancel) {
  return new Promise(res => {
    $("ovTitle").textContent = title; $("ovText").textContent = text;
    $("ovCancel").classList.toggle("hidden", !withCancel);
    $("overlay").classList.remove("hidden");
    $("ovOk").onclick = () => { $("overlay").classList.add("hidden"); res(true); };
    $("ovCancel").onclick = () => { $("overlay").classList.add("hidden"); res(false); };
  });
}

// POST to Apps Script. text/plain avoids a CORS preflight.
async function api(payload) {
  const r = await fetch(CONFIG.SCRIPT_URL, {
    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  return r.json();
}

/* =====================================================================
   State
   ===================================================================== */
let state = null;       // {name, roll, section, order:[{id, opts:[keys]}], idx, answers:{id:[keys]}, start, violations, submitted}
let timerHandle = null;
let lastViolationAt = 0;
let sending = false;

/* =====================================================================
   1. Registration
   ===================================================================== */
$("hdrTitle").textContent = CONFIG.QUIZ_TITLE;

$("btnNext").onclick = () => {
  const name = $("inName").value.trim().replace(/\s+/g, " ");
  const roll = $("inRoll").value.trim().toUpperCase().replace(/\s+/g, "");
  const section = $("inSection").value.trim().toUpperCase();
  if (name.length < 3)   return $("regErr").textContent = "Please enter your full name.";
  if (roll.length < 3)   return $("regErr").textContent = "Please enter your roll number.";
  if (section.length < 1) return $("regErr").textContent = "Please enter your section.";
  $("regErr").textContent = "";
  state = { name, roll, section };
  $("rulesWho").textContent = name + " · " + roll + " · " + section;
  show("scrRules");
};
$("btnBack").onclick = () => show("scrRegister");

$("rulesList").innerHTML = [
  "You have <b>" + CONFIG.DURATION_MIN + " minutes</b>. The quiz submits itself when time runs out.",
  "Questions come <b>one at a time</b> and you <b>cannot go back</b>.",
  "<b>(Single answer)</b> = choose one option. <b>(Select all that apply)</b> = tick every correct option; you only get the mark if all are right.",
  "<b>Do not leave this page</b> (other tabs, apps or notifications). Every switch is recorded. After " + CONFIG.MAX_VIOLATIONS + " warnings the quiz is <b>submitted automatically</b>.",
  "You get <b>one attempt</b> only. Refreshing the page is recorded as a switch."
].map(t => "<li>" + t + "</li>").join("");

/* =====================================================================
   2. Start
   ===================================================================== */
$("btnStart").onclick = async () => {
  if (CONFIG.SCRIPT_URL.indexOf("http") !== 0) {
    $("startErr").textContent = "Quiz is not set up yet (SCRIPT_URL missing). Tell your instructor.";
    return;
  }
  if (localStorage.getItem(DONE_KEY)) {
    $("startErr").textContent = "This device has already submitted this quiz.";
    return;
  }
  $("btnStart").disabled = true; $("startErr").textContent = "Checking…";
  try {
    const res = await api({ action: "start", quizId: CONFIG.QUIZ_ID, name: state.name, roll: state.roll, section: state.section });
    if (!res.ok) { $("startErr").textContent = res.message || "You cannot start this quiz."; $("btnStart").disabled = false; return; }
  } catch (e) {
    $("startErr").textContent = "No connection to the quiz server. Check your internet and try again.";
    $("btnStart").disabled = false; return;
  }
  $("startErr").textContent = "";

  // Build this student's random paper: random question order and option order
  let picked = [];
  Object.entries(CONFIG.SECTION_COUNTS).forEach(([sec, n]) => {
    const pool = QUESTIONS.filter(q => q.sec === sec);
    picked = picked.concat(shuffle(pool).slice(0, n));
  });
  picked = shuffle(picked);                       // mix sections so neighbours see different topics
  state.order = picked.map(q => ({ id: q.id, opts: shuffle(q.options.map(o => o.k)) }));
  state.idx = 0; state.answers = {}; state.start = Date.now(); state.violations = 0; state.submitted = false;
  save();
  beginQuiz();
};

function beginQuiz() {
  document.body.classList.add("locked");
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch (e) {}
  $("watermark").innerHTML = Array(40).fill(esc(state.roll + " · " + state.name)).map(t => "<span>" + t + "</span>").join("");
  show("scrQuiz");
  renderQuestion();
  tick(); timerHandle = setInterval(tick, 1000);
}

/* =====================================================================
   3. Quiz
   ===================================================================== */
const byId = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const LETTERS = "ABCDE";

function renderQuestion() {
  const item = state.order[state.idx];
  const q = byId[item.id];
  const multi = q.type === "cb";
  const chosen = state.answers[q.id] || [];
  $("qCounter").textContent = "Question " + (state.idx + 1) + " of " + state.order.length;
  $("progBar").style.width = (100 * state.idx / state.order.length) + "%";
  $("viol").textContent = "Tab switches: " + state.violations + " / " + CONFIG.MAX_VIOLATIONS;
  $("btnQNext").textContent = state.idx === state.order.length - 1 ? "Submit" : "Next";

  let html = '<div class="qmeta">' + esc(q.section || "") + '</div>';
  html += '<span class="qtype">' + (multi ? "Select all that apply" : "Single answer") + '</span>';
  if (q.context) html += '<div class="ctx">' + esc(q.context) + '</div>';
  html += '<p class="qtext">' + esc(q.text) + '</p>';
  item.opts.forEach((k, i) => {
    const o = q.options.find(x => x.k === k);
    const on = chosen.includes(k);
    html += '<label class="opt' + (on ? " sel" : "") + '"><input type="' + (multi ? "checkbox" : "radio") +
            '" name="opt" value="' + k + '"' + (on ? " checked" : "") + '><b>' + LETTERS[i] + '.</b><span>' + esc(o.t) + '</span></label>';
  });
  $("qCard").innerHTML = html;
  $("qCard").querySelectorAll("input").forEach(inp => inp.onchange = () => {
    const sel = [...$("qCard").querySelectorAll("input:checked")].map(x => x.value);
    state.answers[q.id] = sel;
    $("qCard").querySelectorAll(".opt").forEach(l => l.classList.toggle("sel", l.querySelector("input").checked));
    save();
  });
  window.scrollTo(0, 0);
}

$("btnQNext").onclick = async () => {
  const q = byId[state.order[state.idx].id];
  const ans = state.answers[q.id] || [];
  if (ans.length === 0) {
    const go = await modal("No answer selected", "You have not answered this question. You cannot come back to it. Continue anyway?", true);
    if (!go) return;
  }
  if (state.idx === state.order.length - 1) {
    const ok = await modal("Submit quiz?", "This is the last question. Submit your answers now?", true);
    if (ok) submit(false, "completed");
    return;
  }
  state.idx++; save(); renderQuestion();
};

function tick() {
  const left = Math.max(0, CONFIG.DURATION_MIN * 60000 - (Date.now() - state.start));
  const m = Math.floor(left / 60000), s = Math.floor(left % 60000 / 1000);
  $("timer").textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  $("timer").classList.toggle("low", left < 60000);
  if (left === 0 && !state.submitted) submit(true, "time up");
}

/* ---------- Anti-cheat: leaving the page ---------- */
let unloading = false;                  // a reload is counted once, on resume, not here as well
window.addEventListener("beforeunload", () => { unloading = true; });
function violation(reason) {
  if (unloading || !state || !state.order || state.submitted) return;
  const now = Date.now();
  if (now - lastViolationAt < 1500) return;      // blur + visibilitychange fire together; count once
  lastViolationAt = now;
  state.violations++; save();
  $("viol").textContent = "Tab switches: " + state.violations + " / " + CONFIG.MAX_VIOLATIONS;
  if (state.violations > CONFIG.MAX_VIOLATIONS) {
    submit(true, "too many tab switches");
  } else {
    modal("Warning " + state.violations + " of " + CONFIG.MAX_VIOLATIONS,
      "You left the quiz page (" + reason + "). This has been recorded. " +
      (CONFIG.MAX_VIOLATIONS - state.violations === 0
        ? "This was your last warning: if you leave again, your quiz is submitted automatically."
        : "Warnings left: " + (CONFIG.MAX_VIOLATIONS - state.violations) + ". After that, leaving again submits your quiz automatically."), false);
  }
}
document.addEventListener("visibilitychange", () => { if (document.hidden) violation("switched tab or app"); });
window.addEventListener("blur", () => violation("left the window"));
["copy","cut","paste","contextmenu"].forEach(ev => document.addEventListener(ev, e => {
  if (state && state.order && !state.submitted) e.preventDefault();
}));
document.addEventListener("keydown", e => {   // block common shortcuts (print, save, view source, devtools)
  if (!state || !state.order || state.submitted) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && ["p","s","u","c","a"].includes(k)) e.preventDefault();
  if (k === "f12") e.preventDefault();
});

/* =====================================================================
   4. Submit
   ===================================================================== */
async function submit(auto, reason) {
  if ((state.submitted && state.sentOk) || sending) return;   // never send twice at once
  sending = true;
  state.submitted = true; state.autoSubmitted = auto; state.reason = reason;
  state.submittedAt = state.submittedAt || Date.now(); save();
  clearInterval(timerHandle);
  document.body.classList.remove("locked");
  try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {}
  $("overlay").classList.add("hidden");
  show("scrDone");
  $("doneTitle").textContent = "Submitting…";
  $("doneBody").textContent = auto ? "Your quiz was submitted automatically (" + reason + ")." : "Please keep this page open.";
  $("btnRetry").classList.add("hidden");
  try {
    const res = await api({
      action: "submit", quizId: CONFIG.QUIZ_ID,
      name: state.name, roll: state.roll, section: state.section,
      answers: state.answers, questionIds: state.order.map(o => o.id),
      violations: state.violations, autoSubmitted: auto, reason: reason,
      startedAt: new Date(state.start).toISOString(), submittedAt: new Date(state.submittedAt).toISOString(),
      device: navigator.userAgent.slice(0, 150)
    });
    if (!res.ok) throw new Error(res.message || "Server error");
    state.sentOk = true; save();
    localStorage.setItem(DONE_KEY, state.roll);
    $("doneTitle").textContent = "Submitted ✓";
    let msg = "Thank you, " + state.name + ". Your answers have been recorded.";
    if (auto) msg = "Submitted automatically (" + reason + "). " + msg;
    $("doneBody").innerHTML = esc(msg) +
      (CONFIG.SHOW_SCORE && res.score !== undefined ? '<div class="big">' + res.score + " / " + res.total + "</div>" : "") +
      '<div class="small">You can close this page now.</div>';
  } catch (e) {
    $("doneTitle").textContent = "Not submitted yet";
    $("doneBody").textContent = "Could not reach the server. Your answers are saved on this device. Check your internet, then press Retry.";
    $("btnRetry").classList.remove("hidden");
  }
  sending = false;
}
$("btnRetry").onclick = () => submit(state.autoSubmitted, state.reason);

/* =====================================================================
   Resume after an accidental refresh (counted as a switch)
   ===================================================================== */
(function resume() {
  const saved = load();
  if (!saved || !saved.order) return;
  state = saved;
  if (state.submitted) {               // finished before: show result screen / retry if it never reached the server
    show("scrDone");
    if (state.sentOk) { $("doneTitle").textContent = "Already submitted ✓"; $("doneBody").textContent = "You have already submitted this quiz."; }
    else submit(state.autoSubmitted, state.reason);
    return;
  }
  state.violations++; save();          // a refresh during the quiz counts as a switch
  if (state.violations > CONFIG.MAX_VIOLATIONS) { submit(true, "too many tab switches"); return; }
  beginQuiz();
  modal("Quiz resumed", "The page was reloaded. This has been recorded as a tab switch (" + state.violations + " of " + CONFIG.MAX_VIOLATIONS + ").", false);
})();
</script>
