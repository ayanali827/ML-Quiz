"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is on the y-axis of an ROC curve?","options":[{"k":"A","t":"True positive rate (recall)"},{"k":"B","t":"Precision"},{"k":"C","t":"Accuracy"},{"k":"D","t":"False positive rate"}]},{"id":233,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is on the x-axis of an ROC curve?","options":[{"k":"A","t":"True positive rate"},{"k":"B","t":"Recall"},{"k":"C","t":"Number of samples"},{"k":"D","t":"False positive rate"}]},{"id":234,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What does AUC stand for?","options":[{"k":"A","t":"Average Unit Cost"},{"k":"B","t":"Accuracy Under Classification"},{"k":"C","t":"Area Under the Curve"},{"k":"D","t":"Automatic Unsupervised Clustering"}]},{"id":235,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which statements about AUC are correct?","options":[{"k":"A","t":"It ranges from 0 to 1"},{"k":"B","t":"AUC = 0.2 means an excellent model"},{"k":"C","t":"AUC = 1.0 is a perfect classifier"},{"k":"D","t":"AUC = 0.5 is the same as random guessing"},{"k":"E","t":"A higher AUC is better"}]},{"id":236,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What does the diagonal line from (0, 0) to (1, 1) on an ROC plot represent?","options":[{"k":"A","t":"A perfect classifier"},{"k":"B","t":"A random classifier"},{"k":"C","t":"The best threshold"},{"k":"D","t":"The precision-recall curve"}]},{"id":237,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which point on the ROC plot represents a perfect classifier?","options":[{"k":"A","t":"(1, 0)"},{"k":"B","t":"(0.5, 0.5)"},{"k":"C","t":"(0, 1)"},{"k":"D","t":"(1, 1)"}]},{"id":238,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"How is an ROC curve produced?","options":[{"k":"A","t":"By varying the classification threshold and plotting TPR against FPR"},{"k":"B","t":"By changing the number of clusters"},{"k":"C","t":"By training on more data"},{"k":"D","t":"By plotting accuracy over epochs"}]},{"id":239,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which scikit-learn function computes the points of an ROC curve?","options":[{"k":"A","t":"confusion_matrix()"},{"k":"B","t":"accuracy_score()"},{"k":"C","t":"silhouette_score()"},{"k":"D","t":"roc_curve()"}]},{"id":240,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What does scikit-learn's roc_curve() return?","options":[{"k":"A","t":"fpr"},{"k":"B","t":"Centroids"},{"k":"C","t":"tpr"},{"k":"D","t":"thresholds"},{"k":"E","t":"Inertia"}]},{"id":241,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which scikit-learn function computes the AUC directly from labels and scores?","options":[{"k":"A","t":"auc_curve()"},{"k":"B","t":"roc_auc_score()"},{"k":"C","t":"precision_score()"},{"k":"D","t":"f1_score()"}]},{"id":242,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"To draw an ROC curve, the model must output:","options":[{"k":"A","t":"Only hard class labels"},{"k":"B","t":"Cluster numbers"},{"k":"C","t":"Probabilities or scores"},{"k":"D","t":"Feature names"}]},{"id":243,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which scikit-learn method returns class probabilities?","options":[{"k":"A","t":"predict_proba()"},{"k":"B","t":"predict()"},{"k":"C","t":"fit()"},{"k":"D","t":"transform()"}]},{"id":244,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Model A has AUC = 0.92 and Model B has AUC = 0.78. Which model separates the classes better?","options":[{"k":"A","t":"Model B"},{"k":"B","t":"They are equal"},{"k":"C","t":"Cannot be compared"},{"k":"D","t":"Model A"}]},{"id":245,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"In which tasks is ROC/AUC useful?","options":[{"k":"A","t":"Comparing two classifiers"},{"k":"B","t":"Choosing k in K-Means"},{"k":"C","t":"Choosing a decision threshold"},{"k":"D","t":"Evaluating binary classifiers"},{"k":"E","t":"Calculating entropy"}]},{"id":246,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What does AUC represent in simple words?","options":[{"k":"A","t":"The percentage of correct predictions"},{"k":"B","t":"The number of thresholds tried"},{"k":"C","t":"The probability that a random positive is scored higher than a random negative"},{"k":"D","t":"The training time"}]},{"id":247,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"If the threshold is 0 (everything predicted positive), where is the point on the ROC curve?","options":[{"k":"A","t":"(0, 0)"},{"k":"B","t":"(1, 1)"},{"k":"C","t":"(0, 1)"},{"k":"D","t":"(1, 0)"}]},{"id":248,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"If the threshold is so high that nothing is predicted positive, where is the point on the ROC curve?","options":[{"k":"A","t":"(0, 0)"},{"k":"B","t":"(1, 1)"},{"k":"C","t":"(0, 1)"},{"k":"D","t":"(0.5, 0.5)"}]},{"id":249,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A model's ROC curve lies below the diagonal (AUC < 0.5). What does this mean?","options":[{"k":"A","t":"It is a perfect model"},{"k":"B","t":"It is a random model"},{"k":"C","t":"The data has no labels"},{"k":"D","t":"It is worse than random; flipping its predictions would do better"}]},{"id":250,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which statements about the ROC curve are true?","options":[{"k":"A","t":"It starts at (0, 0)"},{"k":"B","t":"It ends at (1, 1)"},{"k":"C","t":"Its y-axis is precision"},{"k":"D","t":"A curve closer to the top-left corner is better"},{"k":"E","t":"It is a straight line for every model"}]},{"id":251,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"When is a Precision-Recall curve often preferred over an ROC curve?","options":[{"k":"A","t":"When there are no labels"},{"k":"B","t":"When classes are perfectly balanced"},{"k":"C","t":"When the classes are highly imbalanced"},{"k":"D","t":"When using K-Means"}]},{"id":252,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"The ROC curve originally came from which field?","options":[{"k":"A","t":"Biology"},{"k":"B","t":"Signal detection (radar) theory"},{"k":"C","t":"Accounting"},{"k":"D","t":"Music"}]},{"id":253,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A point on the ROC curve has TPR = 0.8 and FPR = 0.2. What does it mean?","options":[{"k":"A","t":"80% of positives are caught and 20% of negatives are wrongly flagged"},{"k":"B","t":"Accuracy is 80%"},{"k":"C","t":"Precision is 20%"},{"k":"D","t":"20% of positives are caught"}]},{"id":254,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A model has TP = 40 and FN = 10. What is its TPR?","options":[{"k":"A","t":"0.25"},{"k":"B","t":"0.40"},{"k":"C","t":"0.50"},{"k":"D","t":"0.80"}]},{"id":255,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which statements about changing the threshold are true?","options":[{"k":"A","t":"Lowering the threshold raises the TPR"},{"k":"B","t":"Lowering the threshold raises the FPR"},{"k":"C","t":"Raising the threshold raises the TPR"},{"k":"D","t":"Raising the threshold lowers the FPR"},{"k":"E","t":"The threshold has no effect on the ROC point"}]},{"id":256,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"How can ROC curves be used for a multi-class problem?","options":[{"k":"A","t":"They cannot be used at all"},{"k":"B","t":"Only by deleting classes"},{"k":"C","t":"By using a one-vs-rest approach for each class"},{"k":"D","t":"By using K-Means first"}]},{"id":257,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"An AUC of 0.85 is generally considered:","options":[{"k":"A","t":"Worse than random"},{"k":"B","t":"Good"},{"k":"C","t":"Random"},{"k":"D","t":"Impossible"}]},{"id":258,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is RocCurveDisplay used for in scikit-learn?","options":[{"k":"A","t":"Plotting an ROC curve"},{"k":"B","t":"Computing a confusion matrix"},{"k":"C","t":"Training a classifier"},{"k":"D","t":"Scaling features"}]},{"id":259,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What is Youden's J statistic (TPR − FPR) used for?","options":[{"k":"A","t":"Choosing k in K-Means"},{"k":"B","t":"Measuring entropy"},{"k":"C","t":"Counting samples"},{"k":"D","t":"Choosing the best threshold on the ROC curve"}]},{"id":260,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which inputs does roc_auc_score() need?","options":[{"k":"A","t":"The true labels (y_true)"},{"k":"B","t":"The number of clusters"},{"k":"C","t":"Predicted probabilities or scores"},{"k":"D","t":"The tree depth"},{"k":"E","t":"The feature names"}]},{"id":261,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"AUC is useful because it does NOT depend on:","options":[{"k":"A","t":"The model"},{"k":"B","t":"The true labels"},{"k":"C","t":"A single chosen threshold"},{"k":"D","t":"The predicted scores"}]},{"id":262,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"A model gives every sample the same probability of 0.5. What is its AUC?","options":[{"k":"A","t":"0.5"},{"k":"B","t":"1.0"},{"k":"C","t":"0"},{"k":"D","t":"0.75"}]},{"id":263,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which plot shows the trade-off between sensitivity and specificity across thresholds?","options":[{"k":"A","t":"Elbow plot"},{"k":"B","t":"ROC curve"},{"k":"C","t":"Dendrogram"},{"k":"D","t":"Histogram"}]},{"id":264,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"An FPR of 0.1 means:","options":[{"k":"A","t":"10% of positives were missed"},{"k":"B","t":"Precision is 10%"},{"k":"C","t":"Accuracy is 90%"},{"k":"D","t":"10% of actual negatives were wrongly predicted positive"}]},{"id":265,"type":"cb","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"In a spam filter where \"spam\" is the positive class, which are correct?","options":[{"k":"A","t":"TP: spam correctly marked as spam"},{"k":"B","t":"FP: a real email marked as spam"},{"k":"C","t":"FN: spam reaching the inbox"},{"k":"D","t":"TN: a real email kept in the inbox"},{"k":"E","t":"FP: spam reaching the inbox"}]},{"id":266,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Two ROC curves cross each other. How should the models be compared?","options":[{"k":"A","t":"Always pick the one with more data"},{"k":"B","t":"They cannot be compared"},{"k":"C","t":"Compare AUC, or the curves in the FPR range that matters for the task"},{"k":"D","t":"Pick the one plotted first"}]},{"id":267,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"What does the ROC curve of a perfect classifier look like?","options":[{"k":"A","t":"It goes straight up from (0, 0) to (0, 1), then across to (1, 1)"},{"k":"B","t":"A diagonal line"},{"k":"C","t":"A line along the x-axis"},{"k":"D","t":"A circle"}]},{"id":268,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"An AUC between 0.5 and 0.6 usually means the model is:","options":[{"k":"A","t":"Excellent"},{"k":"B","t":"Perfect"},{"k":"C","t":"Very good"},{"k":"D","t":"Poor, only a little better than random"}]},{"id":269,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"In the theory course (Week 9), evaluation measures are used to:","options":[{"k":"A","t":"Generate new data"},{"k":"B","t":"Validate the results of ML models"},{"k":"C","t":"Cluster the data"},{"k":"D","t":"Replace training"}]},{"id":270,"type":"mc","sec":"D","section":"Section D: Confusion Matrix & ROC","text":"Which single number summarizes the whole ROC curve?","options":[{"k":"A","t":"Accuracy"},{"k":"B","t":"Recall"},{"k":"C","t":"AUC"},{"k":"D","t":"Support"}]},{"id":271,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Spam email detection is which type of ML problem?","options":[{"k":"A","t":"Regression"},{"k":"B","t":"Clustering"},{"k":"C","t":"Binary classification (spam / not spam)"},{"k":"D","t":"Reinforcement learning"}]},{"id":272,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"In spam filtering, what does \"ham\" mean?","options":[{"k":"A","t":"A legitimate (non-spam) email"},{"k":"B","t":"A spam email"},{"k":"C","t":"A deleted email"},{"k":"D","t":"An email with attachments"}]},{"id":273,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which classic algorithm is most widely used for spam filtering?","options":[{"k":"A","t":"K-Means"},{"k":"B","t":"Apriori"},{"k":"C","t":"Linear regression"},{"k":"D","t":"Naive Bayes"}]},{"id":274,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"The Naive Bayes classifier is based on:","options":[{"k":"A","t":"Euclidean distance"},{"k":"B","t":"Bayes' theorem"},{"k":"C","t":"Information gain"},{"k":"D","t":"Gradient descent only"}]},{"id":275,"type":"cb","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which are common signs (features) of a spam email?","options":[{"k":"A","t":"Words like \"free\" or \"winner\""},{"k":"B","t":"Many exclamation marks"},{"k":"C","t":"Suspicious links"},{"k":"D","t":"The email was sent on a Tuesday"},{"k":"E","t":"An unknown or blacklisted sender"}]},{"id":276,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which is Bayes' theorem?","options":[{"k":"A","t":"P(A|B) = P(B|A) × P(A) / P(B)"},{"k":"B","t":"P(A|B) = P(A) + P(B)"},{"k":"C","t":"P(A|B) = P(A) × P(B)"},{"k":"D","t":"P(A|B) = 1 − P(B)"}]},{"id":277,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"P(Spam), the probability of spam before looking at the email's words, is called the:","options":[{"k":"A","t":"Posterior"},{"k":"B","t":"Likelihood"},{"k":"C","t":"Prior"},{"k":"D","t":"Evidence"}]},{"id":278,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"P(word | Spam) is called the:","options":[{"k":"A","t":"Prior"},{"k":"B","t":"Posterior"},{"k":"C","t":"Margin"},{"k":"D","t":"Likelihood"}]},{"id":279,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"P(Spam | word) is called the:","options":[{"k":"A","t":"Prior"},{"k":"B","t":"Posterior"},{"k":"C","t":"Likelihood"},{"k":"D","t":"Entropy"}]},{"id":280,"type":"cb","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which Naive Bayes classifiers are available in scikit-learn?","options":[{"k":"A","t":"MultinomialNB"},{"k":"B","t":"KMeansNB"},{"k":"C","t":"GaussianNB"},{"k":"D","t":"BernoulliNB"},{"k":"E","t":"TreeNB"}]},{"id":281,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which Naive Bayes variant is best suited to word-count features?","options":[{"k":"A","t":"MultinomialNB"},{"k":"B","t":"GaussianNB"},{"k":"C","t":"LinearNB"},{"k":"D","t":"ClusterNB"}]},{"id":282,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Why is Laplace (add-one) smoothing used in Naive Bayes?","options":[{"k":"A","t":"To speed up training"},{"k":"B","t":"To remove stop words"},{"k":"C","t":"To scale the features"},{"k":"D","t":"To avoid zero probabilities for words not seen in training"}]},{"id":283,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"What does the Bag-of-Words model represent?","options":[{"k":"A","t":"The order of the words"},{"k":"B","t":"The count of each word, ignoring word order"},{"k":"C","t":"The grammar of the sentence"},{"k":"D","t":"The email's sender"}]},{"id":284,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"TF-IDF gives a high weight to words that are:","options":[{"k":"A","t":"Common in every document"},{"k":"B","t":"Stop words"},{"k":"C","t":"Frequent in one document but rare across all documents"},{"k":"D","t":"Very short"}]},{"id":285,"type":"cb","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which are standard text preprocessing steps?","options":[{"k":"A","t":"Tokenization"},{"k":"B","t":"Lowercasing"},{"k":"C","t":"Stop-word removal"},{"k":"D","t":"Stemming or lemmatization"},{"k":"E","t":"Computing cluster centroids"}]},{"id":286,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which of these are stop words?","options":[{"k":"A","t":"\"the\", \"is\", \"and\""},{"k":"B","t":"\"free\", \"winner\", \"cash\""},{"k":"C","t":"\"python\", \"machine\", \"learning\""},{"k":"D","t":"\"spam\", \"ham\", \"email\""}]},{"id":287,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"What does stemming do?","options":[{"k":"A","t":"Translates the word"},{"k":"B","t":"Counts the words"},{"k":"C","t":"Deletes the word"},{"k":"D","t":"Reduces a word to its root form (e.g. \"running\" → \"run\")"}]},{"id":288,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"What does scikit-learn's CountVectorizer do?","options":[{"k":"A","t":"Trains a Naive Bayes model"},{"k":"B","t":"Removes duplicate emails"},{"k":"C","t":"Converts text into a matrix of word counts"},{"k":"D","t":"Plots an ROC curve"}]},{"id":289,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"What does scikit-learn's TfidfVectorizer do?","options":[{"k":"A","t":"Clusters emails"},{"k":"B","t":"Converts text into TF-IDF weighted features"},{"k":"C","t":"Predicts spam directly"},{"k":"D","t":"Translates emails"}]},{"id":290,"type":"cb","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Why is Naive Bayes a good choice for spam filtering?","options":[{"k":"A","t":"It is fast to train"},{"k":"B","t":"It works well with many word features"},{"k":"C","t":"It always gives 100% accuracy"},{"k":"D","t":"It needs relatively little training data"},{"k":"E","t":"It is simple to implement"}]},{"id":291,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"If P(Spam) = 0.3, what is P(Ham)?","options":[{"k":"A","t":"0.3"},{"k":"B","t":"1.3"},{"k":"C","t":"0.7"},{"k":"D","t":"0.03"}]},{"id":292,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"In a training set of 100 emails, 25 are spam. What is the prior P(Spam)?","options":[{"k":"A","t":"0.25"},{"k":"B","t":"0.75"},{"k":"C","t":"25"},{"k":"D","t":"0.5"}]},{"id":293,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"In a spam filter (spam = positive), what is a false positive?","options":[{"k":"A","t":"Spam that reaches the inbox"},{"k":"B","t":"Spam correctly blocked"},{"k":"C","t":"A real email kept in the inbox"},{"k":"D","t":"A real email wrongly sent to the spam folder"}]},{"id":294,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Why are false positives especially bad in spam filtering?","options":[{"k":"A","t":"They make the model slower"},{"k":"B","t":"The user may miss an important email"},{"k":"C","t":"They increase recall"},{"k":"D","t":"They delete the dataset"}]},{"id":295,"type":"cb","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which metrics are used to evaluate a spam classifier?","options":[{"k":"A","t":"Precision"},{"k":"B","t":"Inertia"},{"k":"C","t":"Recall"},{"k":"D","t":"F1-score"},{"k":"E","t":"Confusion matrix"}]},{"id":296,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"What is the \"naive\" assumption in Naive Bayes?","options":[{"k":"A","t":"All emails are spam"},{"k":"B","t":"Words always appear in the same order"},{"k":"C","t":"Features are independent of each other given the class"},{"k":"D","t":"The prior is always 0.5"}]},{"id":297,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"How is a phishing email different from ordinary spam?","options":[{"k":"A","t":"It tries to steal personal information such as passwords"},{"k":"B","t":"It is always harmless advertising"},{"k":"C","t":"It has no links"},{"k":"D","t":"It is the same as ham"}]},{"id":298,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"An email says \"WIN a FREE prize NOW!!! Click here\". A spam filter will most likely classify it as:","options":[{"k":"A","t":"Ham"},{"k":"B","t":"Neutral"},{"k":"C","t":"Unknown"},{"k":"D","t":"Spam"}]},{"id":299,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"What training data does a supervised spam classifier need?","options":[{"k":"A","t":"Emails without any labels"},{"k":"B","t":"Emails labelled as spam or ham"},{"k":"C","t":"Only spam emails"},{"k":"D","t":"Only email subjects"}]},{"id":300,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Naive Bayes multiplies many small probabilities. How is the numerical underflow problem avoided?","options":[{"k":"A","t":"By deleting rare words only"},{"k":"B","t":"By using more emails"},{"k":"C","t":"By adding log-probabilities instead of multiplying probabilities"},{"k":"D","t":"By rounding all probabilities to 1"}]},{"id":301,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Besides Naive Bayes, which supervised algorithm is commonly used for spam classification?","options":[{"k":"A","t":"K-Means"},{"k":"B","t":"Support Vector Machine (SVM)"},{"k":"C","t":"Apriori"},{"k":"D","t":"Hierarchical clustering"}]},{"id":302,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"What is the main advantage of an ML spam filter over a fixed rule-based filter?","options":[{"k":"A","t":"It learns spam patterns from data automatically"},{"k":"B","t":"It never needs data"},{"k":"C","t":"It never makes mistakes"},{"k":"D","t":"It only blocks emails with attachments"}]},{"id":303,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Spammers start writing \"fr33\" instead of \"free\". What should be done with the spam model?","options":[{"k":"A","t":"Nothing"},{"k":"B","t":"Delete the model"},{"k":"C","t":"Switch to K-Means"},{"k":"D","t":"Retrain or update it with new data"}]},{"id":304,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"The feature \"number of links in the email\" is:","options":[{"k":"A","t":"A categorical feature"},{"k":"B","t":"The target"},{"k":"C","t":"A numerical feature"},{"k":"D","t":"A stop word"}]},{"id":305,"type":"cb","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which parts of an email can be used as features for spam detection?","options":[{"k":"A","t":"Subject line"},{"k":"B","t":"Body text"},{"k":"C","t":"Sender address"},{"k":"D","t":"The reader's mood"},{"k":"E","t":"Links in the email"}]},{"id":306,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"In a Bag-of-Words model, what is the vocabulary?","options":[{"k":"A","t":"A dictionary from the internet"},{"k":"B","t":"The set of unique words found in the training emails"},{"k":"C","t":"Only the spam words"},{"k":"D","t":"The list of stop words"}]},{"id":307,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Why is the Bag-of-Words matrix called \"sparse\"?","options":[{"k":"A","t":"Most of its values are zero"},{"k":"B","t":"It has very few rows"},{"k":"C","t":"It contains only ones"},{"k":"D","t":"It is stored on paper"}]},{"id":308,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"The phrase \"free money\" used as a single feature is an example of a:","options":[{"k":"A","t":"Unigram"},{"k":"B","t":"Stop word"},{"k":"C","t":"Centroid"},{"k":"D","t":"Bigram"}]},{"id":309,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Why is the spam dataset split into training and test sets?","options":[{"k":"A","t":"To double the data"},{"k":"B","t":"To remove spam"},{"k":"C","t":"To check performance on emails the model has not seen"},{"k":"D","t":"To create stop words"}]},{"id":310,"type":"cb","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"P(Spam) = 0.5, P(\"offer\" | Spam) = 0.6 and P(\"offer\" | Ham) = 0.2. An email contains \"offer\". Which statements are correct?","options":[{"k":"A","t":"P(\"offer\") = 0.4"},{"k":"B","t":"P(Spam | \"offer\") = 0.75"},{"k":"C","t":"P(Ham | \"offer\") = 0.25"},{"k":"D","t":"P(Spam | \"offer\") = 0.6"},{"k":"E","t":"The email is classified as spam"}]},{"id":311,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"How does Naive Bayes choose the final class?","options":[{"k":"A","t":"The class with the lowest probability"},{"k":"B","t":"The class with the highest posterior probability"},{"k":"C","t":"A random class"},{"k":"D","t":"The class of the nearest neighbour"}]},{"id":312,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Gaussian Naive Bayes is used for:","options":[{"k":"A","t":"Word counts"},{"k":"B","t":"Binary features"},{"k":"C","t":"Continuous numerical features"},{"k":"D","t":"Images only"}]},{"id":313,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Bernoulli Naive Bayes works with features that are:","options":[{"k":"A","t":"Binary (word present or absent)"},{"k":"B","t":"Continuous"},{"k":"C","t":"Text sentences"},{"k":"D","t":"Cluster labels"}]},{"id":314,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Large email providers today filter spam using:","options":[{"k":"A","t":"Only manual checking by staff"},{"k":"B","t":"No filtering at all"},{"k":"C","t":"Only a list of 10 banned words"},{"k":"D","t":"Large-scale machine learning, including deep learning models"}]},{"id":315,"type":"cb","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which are components of Bayes' theorem?","options":[{"k":"A","t":"Prior"},{"k":"B","t":"Likelihood"},{"k":"C","t":"Centroid"},{"k":"D","t":"Evidence"},{"k":"E","t":"Posterior"}]},{"id":316,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"In Bayes' theorem, the evidence P(B) acts as a:","options":[{"k":"A","t":"Learning rate"},{"k":"B","t":"Distance measure"},{"k":"C","t":"Normalizing constant"},{"k":"D","t":"Cluster centre"}]},{"id":317,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"What does lemmatization do?","options":[{"k":"A","t":"Converts a word to its dictionary base form (e.g. \"better\" → \"good\")"},{"k":"B","t":"Removes all vowels"},{"k":"C","t":"Counts characters"},{"k":"D","t":"Translates text to English"}]},{"id":318,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"In scikit-learn, what is a Pipeline used for in a spam project?","options":[{"k":"A","t":"Downloading emails"},{"k":"B","t":"Chaining steps such as a vectorizer and a classifier into one model"},{"k":"C","t":"Drawing the confusion matrix"},{"k":"D","t":"Choosing k"}]},{"id":319,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"90% of the emails in a dataset are ham. A model predicts \"ham\" for every email. What is its accuracy?","options":[{"k":"A","t":"10%"},{"k":"B","t":"50%"},{"k":"C","t":"0%"},{"k":"D","t":"90%"}]},{"id":320,"type":"cb","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which tricks do spammers use to fool spam filters?","options":[{"k":"A","t":"Misspelling words, such as \"fr3e\""},{"k":"B","t":"Putting the text inside images"},{"k":"C","t":"Adding random harmless words"},{"k":"D","t":"Asking the filter politely to let them through"},{"k":"E","t":"Using look-alike characters"}]},{"id":321,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"In spam detection, what does a \"word frequency\" feature measure?","options":[{"k":"A","t":"The length of the email"},{"k":"B","t":"The time the email was sent"},{"k":"C","t":"How many times a word appears in the email"},{"k":"D","t":"The sender's location"}]},{"id":322,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Spam classification is an example of:","options":[{"k":"A","t":"Text classification in Natural Language Processing (NLP)"},{"k":"B","t":"Image segmentation"},{"k":"C","t":"Reinforcement learning"},{"k":"D","t":"Time-series forecasting"}]},{"id":323,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"In TF-IDF, what does TF stand for?","options":[{"k":"A","t":"True False"},{"k":"B","t":"Term Frequency"},{"k":"C","t":"Total Features"},{"k":"D","t":"Test Fraction"}]},{"id":324,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"In TF-IDF, what does IDF stand for?","options":[{"k":"A","t":"Internal Data Format"},{"k":"B","t":"Initial Decision Function"},{"k":"C","t":"Indexed Data Field"},{"k":"D","t":"Inverse Document Frequency"}]},{"id":325,"type":"cb","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Which statements about Naive Bayes are true?","options":[{"k":"A","t":"It is a probabilistic classifier"},{"k":"B","t":"It needs feature scaling to work"},{"k":"C","t":"It assumes features are independent given the class"},{"k":"D","t":"It is an unsupervised method"},{"k":"E","t":"It works well for text classification"}]},{"id":326,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"Without smoothing, a word never seen in spam training emails has P(word | Spam) = 0. What happens?","options":[{"k":"A","t":"The email is always marked spam"},{"k":"B","t":"Nothing"},{"k":"C","t":"The whole spam probability for that email becomes 0"},{"k":"D","t":"The model trains faster"}]},{"id":327,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"What does Laplace (add-one) smoothing add?","options":[{"k":"A","t":"1 to every word count"},{"k":"B","t":"100 to every probability"},{"k":"C","t":"A new class"},{"k":"D","t":"Extra emails"}]},{"id":328,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"For a spam filter, recall measures:","options":[{"k":"A","t":"How many real emails reach the inbox"},{"k":"B","t":"The training speed"},{"k":"C","t":"The number of words"},{"k":"D","t":"The fraction of all spam emails that were caught"}]},{"id":329,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"The spam probability threshold is raised from 0.5 to 0.9. What is the likely effect?","options":[{"k":"A","t":"More real emails are wrongly blocked"},{"k":"B","t":"Fewer real emails are wrongly blocked (precision goes up)"},{"k":"C","t":"All spam is caught"},{"k":"D","t":"No effect"}]},{"id":330,"type":"mc","sec":"E","section":"Section E: Spam Email & Naive Bayes","text":"When a trained spam model receives new emails, they must be:","options":[{"k":"A","t":"Sent without any processing"},{"k":"B","t":"Clustered first"},{"k":"C","t":"Preprocessed and vectorized in the same way as the training emails"},{"k":"D","t":"Translated into another language"}]},{"id":331,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What does KNN stand for?","options":[{"k":"A","t":"K-Nearest Neighbors"},{"k":"B","t":"Kernel Neural Network"},{"k":"C","t":"K-Number Nodes"},{"k":"D","t":"Known Nearest Nodes"}]},{"id":332,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"KNN is which type of algorithm?","options":[{"k":"A","t":"Unsupervised clustering only"},{"k":"B","t":"Reinforcement learning"},{"k":"C","t":"Supervised, used for classification and regression"},{"k":"D","t":"Association rule mining"}]},{"id":333,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What does \"k\" mean in KNN?","options":[{"k":"A","t":"The number of clusters"},{"k":"B","t":"The number of nearest neighbours considered"},{"k":"C","t":"The number of features"},{"k":"D","t":"The number of classes"}]},{"id":334,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"How does KNN classify a new point?","options":[{"k":"A","t":"By the nearest centroid"},{"k":"B","t":"By building a tree"},{"k":"C","t":"By computing entropy"},{"k":"D","t":"By a majority vote among its k nearest neighbours"}]},{"id":335,"type":"cb","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which are steps of the KNN classification algorithm?","options":[{"k":"A","t":"Choose k"},{"k":"B","t":"Compute the centroids of clusters"},{"k":"C","t":"Compute the distance from the new point to all training points"},{"k":"D","t":"Pick the k closest points"},{"k":"E","t":"Take a majority vote of their labels"}]},{"id":336,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"How does KNN regression make a prediction?","options":[{"k":"A","t":"The average of the k nearest neighbours' target values"},{"k":"B","t":"The majority class of the neighbours"},{"k":"C","t":"The maximum value in the dataset"},{"k":"D","t":"The centroid of all data"}]},{"id":337,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which distance does scikit-learn's KNeighborsClassifier use by default?","options":[{"k":"A","t":"Cosine"},{"k":"B","t":"Hamming"},{"k":"C","t":"Jaccard"},{"k":"D","t":"Minkowski with p = 2 (Euclidean)"}]},{"id":338,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Why is KNN called a lazy learner?","options":[{"k":"A","t":"It runs slowly on small data"},{"k":"B","t":"It ignores most features"},{"k":"C","t":"It does not build a model during training; it just stores the data"},{"k":"D","t":"It predicts only one class"}]},{"id":339,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"With k = 1, KNN predicts the class of:","options":[{"k":"A","t":"The majority of all data"},{"k":"B","t":"The single closest training point"},{"k":"C","t":"The farthest training point"},{"k":"D","t":"A random training point"}]},{"id":340,"type":"cb","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which are disadvantages of KNN?","options":[{"k":"A","t":"Slow predictions on large datasets"},{"k":"B","t":"Needs feature scaling"},{"k":"C","t":"Cannot be used for classification"},{"k":"D","t":"Sensitive to irrelevant features"},{"k":"E","t":"Stores the whole training set in memory"}]},{"id":341,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which scikit-learn class is used for KNN classification?","options":[{"k":"A","t":"KMeans"},{"k":"B","t":"NearestCentroid"},{"k":"C","t":"KNeighborsClassifier"},{"k":"D","t":"DecisionTreeClassifier"}]},{"id":342,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which parameter sets k in KNeighborsClassifier?","options":[{"k":"A","t":"n_neighbors"},{"k":"B","t":"n_clusters"},{"k":"C","t":"max_depth"},{"k":"D","t":"k_value"}]},{"id":343,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"A very small k (such as k = 1) usually leads to:","options":[{"k":"A","t":"Underfitting"},{"k":"B","t":"A very smooth boundary"},{"k":"C","t":"No predictions"},{"k":"D","t":"Overfitting and sensitivity to noise"}]},{"id":344,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"A very large k usually leads to:","options":[{"k":"A","t":"Overfitting"},{"k":"B","t":"Underfitting, with an over-smoothed decision boundary"},{"k":"C","t":"Perfect accuracy"},{"k":"D","t":"Faster training"}]},{"id":345,"type":"cb","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which are good ways to choose k in KNN?","options":[{"k":"A","t":"Cross-validation"},{"k":"B","t":"Trying several k values on validation data"},{"k":"C","t":"Always using k = 100"},{"k":"D","t":"Using an odd k for binary problems"},{"k":"E","t":"Using the WCSS elbow from K-Means"}]},{"id":346,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"A common rule of thumb for a starting value of k is:","options":[{"k":"A","t":"k = number of features"},{"k":"B","t":"k = 0"},{"k":"C","t":"k ≈ √n, where n is the number of training samples"},{"k":"D","t":"k = number of classes squared"}]},{"id":347,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What does weights='distance' do in KNeighborsClassifier?","options":[{"k":"A","t":"Gives closer neighbours more influence on the vote"},{"k":"B","t":"Ignores distances"},{"k":"C","t":"Uses only the farthest neighbours"},{"k":"D","t":"Sets k to the distance"}]},{"id":348,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What is a key advantage of KNN?","options":[{"k":"A","t":"Very fast predictions on huge datasets"},{"k":"B","t":"No need to store data"},{"k":"C","t":"Works best with thousands of irrelevant features"},{"k":"D","t":"Simple to understand, with no training phase"}]},{"id":349,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What is the \"curse of dimensionality\" for KNN?","options":[{"k":"A","t":"KNN cannot use more than two features"},{"k":"B","t":"In many dimensions, distances become less meaningful"},{"k":"C","t":"More features always improve KNN"},{"k":"D","t":"k must equal the number of dimensions"}]},{"id":350,"type":"cb","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which distance measures can KNN use?","options":[{"k":"A","t":"Euclidean"},{"k":"B","t":"Manhattan"},{"k":"C","t":"Gini index"},{"k":"D","t":"Minkowski"},{"k":"E","t":"Hamming (for categorical data)"}]},{"id":351,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What does StandardScaler do?","options":[{"k":"A","t":"Scales features to the range 0 to 100"},{"k":"B","t":"Removes outliers"},{"k":"C","t":"Transforms each feature to mean 0 and standard deviation 1"},{"k":"D","t":"Converts text to numbers"}]},{"id":352,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What does MinMaxScaler do?","options":[{"k":"A","t":"Scales each feature to the range 0 to 1"},{"k":"B","t":"Scales features to mean 0"},{"k":"C","t":"Deletes the minimum and maximum values"},{"k":"D","t":"Sorts the data"}]},{"id":353,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Training points: (1, 1) class A, (2, 2) class A, (5, 5) class B. With k = 1, what is the class of the new point (1.5, 1)?","options":[{"k":"A","t":"B"},{"k":"B","t":"A tie"},{"k":"C","t":"Cannot be computed"},{"k":"D","t":"A"}]},{"id":354,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"With k = 5, the neighbours have labels: Yes, Yes, No, Yes, No. What does KNN predict?","options":[{"k":"A","t":"No"},{"k":"B","t":"Yes"},{"k":"C","t":"A tie"},{"k":"D","t":"Nothing"}]},{"id":355,"type":"cb","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which statements about KNN are true?","options":[{"k":"A","t":"It is instance-based"},{"k":"B","t":"It builds a decision tree during training"},{"k":"C","t":"It is non-parametric"},{"k":"D","t":"It is unsupervised"},{"k":"E","t":"Its decision boundary can be very irregular"}]},{"id":356,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Why can an even k cause problems in binary classification?","options":[{"k":"A","t":"KNN cannot compute even numbers"},{"k":"B","t":"Training becomes slower"},{"k":"C","t":"The vote can end in a tie"},{"k":"D","t":"It always overfits"}]},{"id":357,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What is the Euclidean distance between (2, 3) and (5, 7)?","options":[{"k":"A","t":"5"},{"k":"B","t":"7"},{"k":"C","t":"25"},{"k":"D","t":"3"}]},{"id":358,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"In the theory course outline (Week 5), KNN is taught as part of:","options":[{"k":"A","t":"Association rules"},{"k":"B","t":"Bayesian networks"},{"k":"C","t":"Clustering"},{"k":"D","t":"Instance-based learning"}]},{"id":359,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"The time KNN takes to make a prediction grows with:","options":[{"k":"A","t":"The number of classes only"},{"k":"B","t":"The number of training samples"},{"k":"C","t":"The value of the learning rate"},{"k":"D","t":"Nothing; it is always constant"}]},{"id":360,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which data structures can speed up the neighbour search in KNN?","options":[{"k":"A","t":"Confusion matrices"},{"k":"B","t":"Dendrograms"},{"k":"C","t":"KD-trees and Ball trees"},{"k":"D","t":"ROC curves"}]},{"id":361,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Where does KNN spend most of its computation?","options":[{"k":"A","t":"During training"},{"k":"B","t":"During prediction"},{"k":"C","t":"During data collection"},{"k":"D","t":"It needs no computation"}]},{"id":362,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Features are Age (0–100) and Income (0–100,000). If KNN is used without scaling:","options":[{"k":"A","t":"Age dominates the distance"},{"k":"B","t":"Both features count equally"},{"k":"C","t":"KNN refuses to run"},{"k":"D","t":"Income dominates the distance"}]},{"id":363,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Can KNN handle multi-class classification directly?","options":[{"k":"A","t":"Yes, by majority voting among the neighbours"},{"k":"B","t":"No, only binary"},{"k":"C","t":"Only with K-Means first"},{"k":"D","t":"Only for regression"}]},{"id":364,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which scikit-learn tool uses nearest neighbours to fill missing values?","options":[{"k":"A","t":"SimpleImputer"},{"k":"B","t":"StandardScaler"},{"k":"C","t":"KNNImputer"},{"k":"D","t":"LabelEncoder"}]},{"id":365,"type":"cb","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which are real applications of KNN?","options":[{"k":"A","t":"Recommendation systems"},{"k":"B","t":"Handwritten digit recognition"},{"k":"C","t":"Finding clusters in unlabelled data"},{"k":"D","t":"Pattern recognition"},{"k":"E","t":"Credit scoring"}]},{"id":366,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which is the formula for Manhattan distance?","options":[{"k":"A","t":"√Σ (xᵢ − yᵢ)²"},{"k":"B","t":"Σ |xᵢ − yᵢ|"},{"k":"C","t":"max |xᵢ − yᵢ|"},{"k":"D","t":"Σ xᵢ × yᵢ"}]},{"id":367,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Minkowski distance with p = 1 is the same as:","options":[{"k":"A","t":"Manhattan distance"},{"k":"B","t":"Euclidean distance"},{"k":"C","t":"Cosine distance"},{"k":"D","t":"Hamming distance"}]},{"id":368,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Minkowski distance with p = 2 is the same as:","options":[{"k":"A","t":"Manhattan distance"},{"k":"B","t":"Hamming distance"},{"k":"C","t":"Chebyshev distance"},{"k":"D","t":"Euclidean distance"}]},{"id":369,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"With k = 3 and equal votes, the neighbours are: Ham (distance 0.5), Spam (1.0), Spam (2.0). What is the prediction?","options":[{"k":"A","t":"Ham, because it is closest"},{"k":"B","t":"A tie"},{"k":"C","t":"Spam, by a 2–1 majority"},{"k":"D","t":"Cannot be decided"}]},{"id":370,"type":"cb","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which data preparation steps are important before using KNN?","options":[{"k":"A","t":"Scale the features"},{"k":"B","t":"Encode categorical features"},{"k":"C","t":"Compute the entropy of every column"},{"k":"D","t":"Remove irrelevant features"},{"k":"E","t":"Handle missing values"}]},{"id":371,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"How is a KNN classifier usually evaluated?","options":[{"k":"A","t":"With the WCSS"},{"k":"B","t":"With accuracy and a confusion matrix on test data"},{"k":"C","t":"With a dendrogram"},{"k":"D","t":"With the silhouette score"}]},{"id":372,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Why plot test accuracy against different values of k?","options":[{"k":"A","t":"To find the best k"},{"k":"B","t":"To compute centroids"},{"k":"C","t":"To scale the data"},{"k":"D","t":"To remove the labels"}]},{"id":373,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What does weights='uniform' mean in KNeighborsClassifier?","options":[{"k":"A","t":"Closer neighbours count more"},{"k":"B","t":"Only one neighbour is used"},{"k":"C","t":"Farther neighbours count more"},{"k":"D","t":"All k neighbours have an equal vote"}]},{"id":374,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which scikit-learn class is used for KNN regression?","options":[{"k":"A","t":"KNeighborsClassifier"},{"k":"B","t":"KMeansRegressor"},{"k":"C","t":"KNeighborsRegressor"},{"k":"D","t":"LinearRegression"}]},{"id":375,"type":"cb","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which statements comparing KNN and K-Means are correct?","options":[{"k":"A","t":"KNN is supervised"},{"k":"B","t":"K-Means is unsupervised"},{"k":"C","t":"Both rely on distance calculations"},{"k":"D","t":"In both, k means the same thing"},{"k":"E","t":"K-Means uses class labels"}]},{"id":376,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"How can an outlier in the training data affect KNN with k = 1?","options":[{"k":"A","t":"It has no effect"},{"k":"B","t":"New points near it may be misclassified"},{"k":"C","t":"It improves accuracy"},{"k":"D","t":"It changes k automatically"}]},{"id":377,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What is the Euclidean distance between (0, 0) and (6, 8)?","options":[{"k":"A","t":"14"},{"k":"B","t":"48"},{"k":"C","t":"7"},{"k":"D","t":"10"}]},{"id":378,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What is the Manhattan distance between (0, 0) and (6, 8)?","options":[{"k":"A","t":"14"},{"k":"B","t":"10"},{"k":"C","t":"48"},{"k":"D","t":"2"}]},{"id":379,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What does a trained KNN model store?","options":[{"k":"A","t":"Only the centroids"},{"k":"B","t":"A decision tree"},{"k":"C","t":"The entire training dataset"},{"k":"D","t":"Nothing"}]},{"id":380,"type":"cb","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What happens when k is increased in KNN?","options":[{"k":"A","t":"The decision boundary becomes smoother"},{"k":"B","t":"The model becomes less sensitive to noise"},{"k":"C","t":"The model always overfits more"},{"k":"D","t":"Too large a k can cause underfitting"},{"k":"E","t":"Training becomes much slower"}]},{"id":381,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What does the score() method of KNeighborsClassifier return?","options":[{"k":"A","t":"The value of k"},{"k":"B","t":"The mean accuracy on the given data"},{"k":"C","t":"The distances"},{"k":"D","t":"The confusion matrix"}]},{"id":382,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"If all features are categorical, which distance is suitable for KNN?","options":[{"k":"A","t":"Euclidean"},{"k":"B","t":"Manhattan"},{"k":"C","t":"Minkowski with p = 3"},{"k":"D","t":"Hamming"}]},{"id":383,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"A useless feature, such as a random ID number, is included in KNN. What happens?","options":[{"k":"A","t":"It can distort distances and lower accuracy"},{"k":"B","t":"It always improves accuracy"},{"k":"C","t":"KNN ignores it automatically"},{"k":"D","t":"It becomes the target"}]},{"id":384,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which scikit-learn function runs k-fold cross-validation and returns a score for each fold?","options":[{"k":"A","t":"train_test_split()"},{"k":"B","t":"confusion_matrix()"},{"k":"C","t":"cross_val_score()"},{"k":"D","t":"fit_transform()"}]},{"id":385,"type":"cb","sec":"F","section":"Section F: K-Nearest Neighbors","text":"Which are hyperparameters of KNeighborsClassifier?","options":[{"k":"A","t":"n_neighbors"},{"k":"B","t":"weights"},{"k":"C","t":"max_depth"},{"k":"D","t":"metric"},{"k":"E","t":"p"}]},{"id":386,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"A new point is exactly the same as a training point, and k = 1. What does KNN predict?","options":[{"k":"A","t":"A random class"},{"k":"B","t":"The label of that identical training point"},{"k":"C","t":"Nothing"},{"k":"D","t":"The majority class of the dataset"}]},{"id":387,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What kind of decision boundary does KNN usually produce?","options":[{"k":"A","t":"Always a straight line"},{"k":"B","t":"A circle"},{"k":"C","t":"No boundary"},{"k":"D","t":"A non-linear, flexible boundary"}]},{"id":388,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What is GridSearchCV used for with KNN?","options":[{"k":"A","t":"Searching for the best hyperparameters, such as k"},{"k":"B","t":"Drawing a grid on a plot"},{"k":"C","t":"Clustering the data"},{"k":"D","t":"Removing features"}]},{"id":389,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"KNN is called \"non-parametric\" because:","options":[{"k":"A","t":"It has no hyperparameters"},{"k":"B","t":"It uses no distance"},{"k":"C","t":"It does not assume a fixed form for the decision function"},{"k":"D","t":"It cannot be tuned"}]},{"id":390,"type":"mc","sec":"F","section":"Section F: K-Nearest Neighbors","text":"What is the main problem of using KNN on 1,000,000 training samples?","options":[{"k":"A","t":"It cannot store the labels"},{"k":"B","t":"Predictions become slow"},{"k":"C","t":"It always underfits"},{"k":"D","t":"It needs a GPU to train"}]},{"id":391,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is machine learning?","options":[{"k":"A","t":"Writing every rule by hand"},{"k":"B","t":"Building systems that learn patterns from data and experience"},{"k":"C","t":"Repairing computer hardware"},{"k":"D","t":"Storing data in spreadsheets"}]},{"id":392,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"How are AI and machine learning related?","options":[{"k":"A","t":"They are unrelated"},{"k":"B","t":"AI is a subset of ML"},{"k":"C","t":"They are exactly the same thing"},{"k":"D","t":"ML is a subset of AI"}]},{"id":393,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is the main focus of data mining?","options":[{"k":"A","t":"Discovering useful patterns and knowledge in large datasets"},{"k":"B","t":"Building robots"},{"k":"C","t":"Designing computer chips"},{"k":"D","t":"Writing operating systems"}]},{"id":394,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Supervised learning uses:","options":[{"k":"A","t":"No data"},{"k":"B","t":"Only rewards"},{"k":"C","t":"Labelled data (inputs with known outputs)"},{"k":"D","t":"Only unlabelled data"}]},{"id":395,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which are examples of supervised learning?","options":[{"k":"A","t":"Spam detection"},{"k":"B","t":"Customer segmentation with no labels"},{"k":"C","t":"House price prediction"},{"k":"D","t":"Churn prediction"},{"k":"E","t":"Market basket analysis"}]},{"id":396,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"A regression model predicts:","options":[{"k":"A","t":"A class label"},{"k":"B","t":"A continuous numerical value"},{"k":"C","t":"A cluster number"},{"k":"D","t":"An association rule"}]},{"id":397,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"A classification model predicts:","options":[{"k":"A","t":"A discrete class label"},{"k":"B","t":"A continuous value"},{"k":"C","t":"A centroid"},{"k":"D","t":"A probability distribution of features"}]},{"id":398,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which of these is a regression task?","options":[{"k":"A","t":"Spam or not spam"},{"k":"B","t":"Cat or dog image"},{"k":"C","t":"Churn yes or no"},{"k":"D","t":"Predicting tomorrow's temperature"}]},{"id":399,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Despite its name, logistic regression is used for:","options":[{"k":"A","t":"Clustering"},{"k":"B","t":"Regression only"},{"k":"C","t":"Classification"},{"k":"D","t":"Association rules"}]},{"id":400,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which are classification algorithms?","options":[{"k":"A","t":"Logistic regression"},{"k":"B","t":"Decision tree"},{"k":"C","t":"K-Means"},{"k":"D","t":"Support Vector Machine"},{"k":"E","t":"Naive Bayes"}]},{"id":401,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is the purpose of data preprocessing?","options":[{"k":"A","t":"To make the model slower"},{"k":"B","t":"To clean and prepare raw data for modelling"},{"k":"C","t":"To delete all data"},{"k":"D","t":"To evaluate the final model"}]},{"id":402,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"How are missing numerical values commonly handled?","options":[{"k":"A","t":"By filling them with the mean or median (imputation)"},{"k":"B","t":"By replacing them with random text"},{"k":"C","t":"By doubling them"},{"k":"D","t":"They never need handling"}]},{"id":403,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is an outlier?","options":[{"k":"A","t":"The most common value"},{"k":"B","t":"A missing value"},{"k":"C","t":"A value very far from the other values"},{"k":"D","t":"The target column"}]},{"id":404,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What does one-hot encoding do?","options":[{"k":"A","t":"Scales values to 0–1"},{"k":"B","t":"Removes duplicate rows"},{"k":"C","t":"Fills missing values"},{"k":"D","t":"Converts each category into its own binary (0/1) column"}]},{"id":405,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which are data preprocessing steps?","options":[{"k":"A","t":"Handling missing values"},{"k":"B","t":"Encoding categorical variables"},{"k":"C","t":"Feature scaling"},{"k":"D","t":"Removing duplicate rows"},{"k":"E","t":"Drawing the ROC curve"}]},{"id":406,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Artificial Neural Networks are inspired by:","options":[{"k":"A","t":"Decision trees"},{"k":"B","t":"Neurons in the human brain"},{"k":"C","t":"Computer networks"},{"k":"D","t":"Spreadsheets"}]},{"id":407,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is the basic unit of a neural network?","options":[{"k":"A","t":"The neuron (perceptron)"},{"k":"B","t":"The leaf"},{"k":"C","t":"The centroid"},{"k":"D","t":"The support vector"}]},{"id":408,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Why are activation functions used in neural networks?","options":[{"k":"A","t":"To store data"},{"k":"B","t":"To remove neurons"},{"k":"C","t":"To add non-linearity so the network can learn complex patterns"},{"k":"D","t":"To split the data"}]},{"id":409,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What does backpropagation do?","options":[{"k":"A","t":"Collects new data"},{"k":"B","t":"Chooses k"},{"k":"C","t":"Draws the network"},{"k":"D","t":"Computes gradients of the error to update the weights"}]},{"id":410,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which are activation functions?","options":[{"k":"A","t":"ReLU"},{"k":"B","t":"Sigmoid"},{"k":"C","t":"Gini"},{"k":"D","t":"Tanh"},{"k":"E","t":"Softmax"}]},{"id":411,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is the output range of the sigmoid function?","options":[{"k":"A","t":"−1 to 1"},{"k":"B","t":"0 to 1"},{"k":"C","t":"0 to infinity"},{"k":"D","t":"−infinity to infinity"}]},{"id":412,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which is the ReLU function?","options":[{"k":"A","t":"max(0, x)"},{"k":"B","t":"1 / (1 + e⁻ˣ)"},{"k":"C","t":"x²"},{"k":"D","t":"min(0, x)"}]},{"id":413,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Where are the hidden layers in a neural network?","options":[{"k":"A","t":"Before the input layer"},{"k":"B","t":"After the output layer"},{"k":"C","t":"Inside the dataset"},{"k":"D","t":"Between the input and output layers"}]},{"id":414,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What does the learning rate control?","options":[{"k":"A","t":"The number of layers"},{"k":"B","t":"The size of the dataset"},{"k":"C","t":"The size of each weight update step"},{"k":"D","t":"The number of classes"}]},{"id":415,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which terms are related to Support Vector Machines?","options":[{"k":"A","t":"Hyperplane"},{"k":"B","t":"Support vectors"},{"k":"C","t":"Centroid"},{"k":"D","t":"Margin"},{"k":"E","t":"Kernel"}]},{"id":416,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What are support vectors?","options":[{"k":"A","t":"All training points"},{"k":"B","t":"The training points closest to the decision boundary"},{"k":"C","t":"The cluster centres"},{"k":"D","t":"The misclassified points only"}]},{"id":417,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What does the kernel trick in SVM do?","options":[{"k":"A","t":"Deletes outliers"},{"k":"B","t":"Speeds up data loading"},{"k":"C","t":"Converts labels to numbers"},{"k":"D","t":"Lets SVM separate non-linear data by mapping it to a higher-dimensional space"}]},{"id":418,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which is a commonly used SVM kernel?","options":[{"k":"A","t":"RBF (Radial Basis Function)"},{"k":"B","t":"Gini"},{"k":"C","t":"Entropy"},{"k":"D","t":"Elbow"}]},{"id":419,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What does the C parameter in SVM control?","options":[{"k":"A","t":"The number of classes"},{"k":"B","t":"The number of clusters"},{"k":"C","t":"The trade-off between a wide margin and misclassification errors"},{"k":"D","t":"The tree depth"}]},{"id":420,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which are ensemble learning methods?","options":[{"k":"A","t":"Bagging"},{"k":"B","t":"Boosting"},{"k":"C","t":"K-Means"},{"k":"D","t":"Stacking"},{"k":"E","t":"Random Forest"}]},{"id":421,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is bagging?","options":[{"k":"A","t":"Training models one after another on errors"},{"k":"B","t":"Training models in parallel on random bootstrap samples and combining them"},{"k":"C","t":"Removing features"},{"k":"D","t":"A clustering method"}]},{"id":422,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is boosting?","options":[{"k":"A","t":"Training all models independently"},{"k":"B","t":"Using only one model"},{"k":"C","t":"Clustering the data first"},{"k":"D","t":"Training models sequentially, each focusing on the previous model's errors"}]},{"id":423,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"How does a Random Forest classifier make its final prediction?","options":[{"k":"A","t":"By a majority vote of its trees"},{"k":"B","t":"By using only the first tree"},{"k":"C","t":"By the nearest centroid"},{"k":"D","t":"By Bayes' theorem"}]},{"id":424,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is deep learning?","options":[{"k":"A","t":"Learning with decision trees only"},{"k":"B","t":"Learning without data"},{"k":"C","t":"Machine learning with neural networks that have many layers"},{"k":"D","t":"A type of clustering"}]},{"id":425,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is instance-based learning?","options":[{"k":"A","t":"Learning a fixed equation from data"},{"k":"B","t":"Predicting by comparing new instances with stored training instances (e.g. KNN)"},{"k":"C","t":"Learning from rewards"},{"k":"D","t":"Building association rules"}]},{"id":426,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What does hierarchical clustering produce?","options":[{"k":"A","t":"A single centroid"},{"k":"B","t":"A confusion matrix"},{"k":"C","t":"A tree of nested clusters (dendrogram)"},{"k":"D","t":"A set of association rules"}]},{"id":427,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is agglomerative hierarchical clustering?","options":[{"k":"A","t":"A bottom-up method that repeatedly merges the closest clusters"},{"k":"B","t":"A top-down method that splits clusters"},{"k":"C","t":"A supervised method"},{"k":"D","t":"A rule-mining method"}]},{"id":428,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is divisive hierarchical clustering?","options":[{"k":"A","t":"A bottom-up merging method"},{"k":"B","t":"A reinforcement learning method"},{"k":"C","t":"A distance measure"},{"k":"D","t":"A top-down method that starts with one cluster and splits it"}]},{"id":429,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"In single linkage, the distance between two clusters is:","options":[{"k":"A","t":"The distance between their farthest points"},{"k":"B","t":"The distance between their closest points"},{"k":"C","t":"The distance between their centroids only"},{"k":"D","t":"Always zero"}]},{"id":430,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which are linkage methods in hierarchical clustering?","options":[{"k":"A","t":"Single linkage"},{"k":"B","t":"Complete linkage"},{"k":"C","t":"Entropy linkage"},{"k":"D","t":"Average linkage"},{"k":"E","t":"Ward's method"}]},{"id":431,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Does hierarchical clustering need k to be fixed before it runs?","options":[{"k":"A","t":"Yes, always"},{"k":"B","t":"Only for two clusters"},{"k":"C","t":"No; the number of clusters is chosen by cutting the dendrogram"},{"k":"D","t":"Only when using labels"}]},{"id":432,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which is an example of probability-based clustering?","options":[{"k":"A","t":"K-Means"},{"k":"B","t":"Gaussian Mixture Model (trained with EM)"},{"k":"C","t":"Decision tree"},{"k":"D","t":"Apriori"}]},{"id":433,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is incremental clustering?","options":[{"k":"A","t":"Updating the clusters as new data points arrive, one at a time"},{"k":"B","t":"Clustering only once a year"},{"k":"C","t":"Using labels to cluster"},{"k":"D","t":"Increasing k every iteration"}]},{"id":434,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What does association rule mining find?","options":[{"k":"A","t":"Cluster centres"},{"k":"B","t":"The best decision tree"},{"k":"C","t":"The ROC curve"},{"k":"D","t":"Items that frequently occur together"}]},{"id":435,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which measures are used to evaluate association rules?","options":[{"k":"A","t":"Support"},{"k":"B","t":"Recall"},{"k":"C","t":"Confidence"},{"k":"D","t":"Inertia"},{"k":"E","t":"Lift"}]},{"id":436,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is the support of an itemset?","options":[{"k":"A","t":"The number of items in it"},{"k":"B","t":"The fraction of transactions that contain the itemset"},{"k":"C","t":"The price of the items"},{"k":"D","t":"The confidence of a rule"}]},{"id":437,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is the confidence of the rule A → B?","options":[{"k":"A","t":"support(A)"},{"k":"B","t":"support(B) × support(A)"},{"k":"C","t":"support(A and B) ÷ support(A)"},{"k":"D","t":"1 − support(A)"}]},{"id":438,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"A rule has lift greater than 1. What does this mean?","options":[{"k":"A","t":"The items are positively associated (they occur together more than by chance)"},{"k":"B","t":"The items never occur together"},{"k":"C","t":"The rule is wrong"},{"k":"D","t":"The items are independent"}]},{"id":439,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Out of 100 transactions, 20 contain bread and 10 contain both bread and butter. What is the confidence of bread → butter?","options":[{"k":"A","t":"0.10"},{"k":"B","t":"0.20"},{"k":"C","t":"2.0"},{"k":"D","t":"0.50"}]},{"id":440,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which statements about the Apriori algorithm are true?","options":[{"k":"A","t":"It uses a minimum support threshold"},{"k":"B","t":"Every subset of a frequent itemset is also frequent"},{"k":"C","t":"It builds an FP-tree"},{"k":"D","t":"It generates candidate itemsets level by level"},{"k":"E","t":"It is a supervised classifier"}]},{"id":441,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is the main advantage of FP-Growth over Apriori?","options":[{"k":"A","t":"It needs labelled data"},{"k":"B","t":"It avoids candidate generation and scans the database fewer times, so it is faster"},{"k":"C","t":"It produces decision trees"},{"k":"D","t":"It uses no support threshold"}]},{"id":442,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which data structure does FP-Growth build?","options":[{"k":"A","t":"An FP-tree (frequent-pattern tree)"},{"k":"B","t":"A dendrogram"},{"k":"C","t":"A confusion matrix"},{"k":"D","t":"A KD-tree"}]},{"id":443,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Market basket analysis is an application of:","options":[{"k":"A","t":"K-Nearest Neighbors"},{"k":"B","t":"Linear regression"},{"k":"C","t":"Association rule mining"},{"k":"D","t":"Reinforcement learning"}]},{"id":444,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Milk appears in 50 out of 200 transactions. What is the support of {milk}?","options":[{"k":"A","t":"0.50"},{"k":"B","t":"4.0"},{"k":"C","t":"50"},{"k":"D","t":"0.25"}]},{"id":445,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which statements about training, validation and test sets are correct?","options":[{"k":"A","t":"The training set is used to fit the model"},{"k":"B","t":"The validation set is used to tune hyperparameters"},{"k":"C","t":"The test set should be used for repeated tuning"},{"k":"D","t":"The test set gives the final, unbiased evaluation"},{"k":"E","t":"Training accuracy is the best final score to report"}]},{"id":446,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"In 5-fold cross-validation:","options":[{"k":"A","t":"The data is split into 5 parts, and each part is used once as the test fold"},{"k":"B","t":"The model is trained 5 times on the same data"},{"k":"C","t":"Only 5 samples are used"},{"k":"D","t":"5 different datasets are downloaded"}]},{"id":447,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which train-test split ratio is very common?","options":[{"k":"A","t":"10% train / 90% test"},{"k":"B","t":"50% train / 50% test always"},{"k":"C","t":"80% train / 20% test"},{"k":"D","t":"100% train / 0% test"}]},{"id":448,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is overfitting?","options":[{"k":"A","t":"The model is too simple"},{"k":"B","t":"The model learns noise in the training data and performs poorly on new data"},{"k":"C","t":"The model has too little data to load"},{"k":"D","t":"The model has perfect test accuracy"}]},{"id":449,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is underfitting?","options":[{"k":"A","t":"The model memorizes the training data"},{"k":"B","t":"The model is perfect"},{"k":"C","t":"The model has too many parameters"},{"k":"D","t":"The model is too simple and performs poorly on both training and test data"}]},{"id":450,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which are signs of underfitting?","options":[{"k":"A","t":"Low training accuracy"},{"k":"B","t":"High training accuracy but low test accuracy"},{"k":"C","t":"Low test accuracy"},{"k":"D","t":"The model is too simple for the data"},{"k":"E","t":"Perfect training accuracy"}]},{"id":451,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"A model with high bias usually:","options":[{"k":"A","t":"Underfits"},{"k":"B","t":"Overfits"},{"k":"C","t":"Is perfect"},{"k":"D","t":"Has no errors"}]},{"id":452,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"A model with high variance usually:","options":[{"k":"A","t":"Underfits"},{"k":"B","t":"Ignores the training data"},{"k":"C","t":"Overfits"},{"k":"D","t":"Has equal train and test accuracy"}]},{"id":453,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What does regularization add to a model's training?","options":[{"k":"A","t":"More training data"},{"k":"B","t":"More layers"},{"k":"C","t":"Extra features"},{"k":"D","t":"A penalty on large weights to reduce overfitting"}]},{"id":454,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"L1 regularization (Lasso) can:","options":[{"k":"A","t":"Increase every weight"},{"k":"B","t":"Set some weights to exactly zero, acting as feature selection"},{"k":"C","t":"Remove the target"},{"k":"D","t":"Create new clusters"}]},{"id":455,"type":"cb","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"Which of these are unsupervised methods taught before Week 7?","options":[{"k":"A","t":"K-Means"},{"k":"B","t":"Hierarchical clustering"},{"k":"C","t":"Support Vector Machine"},{"k":"D","t":"Apriori"},{"k":"E","t":"FP-Growth"}]},{"id":456,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"How can clustering be used for classification?","options":[{"k":"A","t":"It cannot be used"},{"k":"B","t":"By deleting all clusters"},{"k":"C","t":"By labelling each cluster with the majority class of its points"},{"k":"D","t":"By computing entropy only"}]},{"id":457,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"In hierarchical clustering, how is the final number of clusters chosen?","options":[{"k":"A","t":"By cutting the dendrogram at a chosen height"},{"k":"B","t":"By the confusion matrix"},{"k":"C","t":"By the learning rate"},{"k":"D","t":"It is always 2"}]},{"id":458,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is early stopping?","options":[{"k":"A","t":"Stopping data collection"},{"k":"B","t":"Stopping after the first epoch always"},{"k":"C","t":"Stopping the test set"},{"k":"D","t":"Stopping training when validation error starts to rise"}]},{"id":459,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is the difference between a parameter and a hyperparameter?","options":[{"k":"A","t":"There is no difference"},{"k":"B","t":"A hyperparameter (e.g. k in KNN) is set before training; parameters (e.g. weights) are learned"},{"k":"C","t":"Parameters are set by hand; hyperparameters are learned"},{"k":"D","t":"Hyperparameters only exist in clustering"}]},{"id":460,"type":"mc","sec":"G","section":"Section G: Course Topics (Weeks 1-7)","text":"What is data leakage?","options":[{"k":"A","t":"Losing the dataset"},{"k":"B","t":"Having missing values"},{"k":"C","t":"Information from the test data getting into training, giving misleadingly high scores"},{"k":"D","t":"Using too few features"}]},{"id":461,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Why do we visualize machine learning outcomes?","options":[{"k":"A","t":"To understand and communicate the model's results"},{"k":"B","t":"To make training slower"},{"k":"C","t":"To replace the model"},{"k":"D","t":"To delete errors"}]},{"id":462,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does a learning curve show?","options":[{"k":"A","t":"The ROC curve"},{"k":"B","t":"The tree structure"},{"k":"C","t":"Training and validation scores as the training set grows"},{"k":"D","t":"Cluster centres"}]},{"id":463,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which chart is most suitable for showing feature importances?","options":[{"k":"A","t":"Pie of the dataset rows"},{"k":"B","t":"Dendrogram"},{"k":"C","t":"ROC curve"},{"k":"D","t":"Bar chart"}]},{"id":464,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"A scatter plot is used to show:","options":[{"k":"A","t":"One category's count"},{"k":"B","t":"The relationship between two numerical variables"},{"k":"C","t":"A confusion matrix"},{"k":"D","t":"Text sentiment"}]},{"id":465,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which are common visualizations of ML results?","options":[{"k":"A","t":"Confusion matrix heatmap"},{"k":"B","t":"ROC curve"},{"k":"C","t":"Learning curve"},{"k":"D","t":"Feature importance bar chart"},{"k":"E","t":"A recipe card"}]},{"id":466,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is a Bayesian network?","options":[{"k":"A","t":"A computer network"},{"k":"B","t":"A clustering algorithm"},{"k":"C","t":"A probabilistic graphical model shown as a directed acyclic graph"},{"k":"D","t":"A type of decision tree"}]},{"id":467,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"In a Bayesian network, what do the nodes represent?","options":[{"k":"A","t":"Random variables"},{"k":"B","t":"Training samples"},{"k":"C","t":"Cluster centres"},{"k":"D","t":"Layers"}]},{"id":468,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"In a Bayesian network, what do the directed edges represent?","options":[{"k":"A","t":"Distances"},{"k":"B","t":"Errors"},{"k":"C","t":"Weights of a neural network"},{"k":"D","t":"Direct (conditional) dependencies between variables"}]},{"id":469,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is attached to each node of a Bayesian network?","options":[{"k":"A","t":"A centroid"},{"k":"B","t":"A conditional probability table (CPT)"},{"k":"C","t":"A confusion matrix"},{"k":"D","t":"A learning rate"}]},{"id":470,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Where are Bayesian networks used?","options":[{"k":"A","t":"Medical diagnosis"},{"k":"B","t":"Sorting arrays"},{"k":"C","t":"Risk analysis"},{"k":"D","t":"Reasoning under uncertainty"},{"k":"E","t":"Resizing images"}]},{"id":471,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is deviation (anomaly) detection?","options":[{"k":"A","t":"Finding the average value"},{"k":"B","t":"Building a decision tree"},{"k":"C","t":"Finding unusual data points that differ from normal behaviour"},{"k":"D","t":"Cleaning text"}]},{"id":472,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which is a typical application of anomaly detection?","options":[{"k":"A","t":"Credit card fraud detection"},{"k":"B","t":"Sorting names"},{"k":"C","t":"Translating text"},{"k":"D","t":"Image resizing"}]},{"id":473,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Isolation Forest is used for:","options":[{"k":"A","t":"Clustering only"},{"k":"B","t":"Regression"},{"k":"C","t":"Association rules"},{"k":"D","t":"Anomaly detection"}]},{"id":474,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which is an example of ML in healthcare (Case Study 1)?","options":[{"k":"A","t":"Predicting stock prices"},{"k":"B","t":"Predicting diseases from patient data"},{"k":"C","t":"Recommending movies"},{"k":"D","t":"Detecting spam emails"}]},{"id":475,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which are applications of ML in healthcare?","options":[{"k":"A","t":"Diagnosing disease from medical images"},{"k":"B","t":"Predicting football scores"},{"k":"C","t":"Predicting hospital readmission"},{"k":"D","t":"Drug discovery"},{"k":"E","t":"Patient risk scoring"}]},{"id":476,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"In disease diagnosis, failing to detect a sick patient is a false negative. Which metric should be maximized?","options":[{"k":"A","t":"Precision"},{"k":"B","t":"Specificity"},{"k":"C","t":"Recall"},{"k":"D","t":"Training speed"}]},{"id":477,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is a major concern when using patient data for ML?","options":[{"k":"A","t":"Privacy and confidentiality"},{"k":"B","t":"Too few hospitals exist"},{"k":"C","t":"Patients have no data"},{"k":"D","t":"Data is always perfect"}]},{"id":478,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What does software development effort estimation predict (Case Study 3)?","options":[{"k":"A","t":"The number of bugs in a game"},{"k":"B","t":"The software's price on the market"},{"k":"C","t":"The colour of the user interface"},{"k":"D","t":"The person-hours or person-months needed to build the software"}]},{"id":479,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Software effort estimation is usually which type of ML task?","options":[{"k":"A","t":"Clustering"},{"k":"B","t":"Regression"},{"k":"C","t":"Association rules"},{"k":"D","t":"Binary classification"}]},{"id":480,"type":"cb","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which are useful features for software effort estimation?","options":[{"k":"A","t":"Project size (lines of code or function points)"},{"k":"B","t":"Team experience"},{"k":"C","t":"Project complexity"},{"k":"D","t":"The team's favourite food"},{"k":"E","t":"Number of requirements"}]},{"id":481,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"Which metric is suitable for evaluating effort estimation (a regression task)?","options":[{"k":"A","t":"Accuracy"},{"k":"B","t":"Recall"},{"k":"C","t":"Mean Absolute Error (MAE) or RMSE"},{"k":"D","t":"Silhouette score"}]},{"id":482,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is sentiment analysis?","options":[{"k":"A","t":"Identifying the opinion (positive, negative or neutral) in text"},{"k":"B","t":"Counting the words in a text"},{"k":"C","t":"Translating text"},{"k":"D","t":"Correcting spelling"}]},{"id":483,"type":"mc","sec":"H","section":"Section H: Course Topics (Weeks 9-15)","text":"What is aspect-based sentiment analysis?","options":[{"k":"A","t":"Giving one overall sentiment per review"},{"k":"B","t":"Counting the number of reviews"},{"k":"C","t":"Clustering reviews by length"},{"k":"D","t":"Finding the sentiment towards each aspect, e.g. food good, service bad"}]},{"
